# =============================================================================
# infra/demo/iam-traefik.override.yml — iam 을 통합 데모의 신원 엣지로 만든다
# =============================================================================
# TASK-MONO-358.
#
# 왜 이 파일이 필요한가 (실측으로 확인된 것들)
# -----------------------------------------------------------------------------
# iam 의 앱 컨테이너는 `docker-compose.e2e.yml` 이 정의하는데(데모가 앱을 얻으려고
# 함께 올리는 오버레이 — MONO-342), 그 파일은 **CI e2e 용**이다:
#
#   gateway-service:
#     ports: ["18080:8080"]
#     networks: [iam-e2e]          ← traefik-net 이 아니다
#
# 결과가 둘이다.
#
#   (1) **Traefik 이 iam 에 라우팅할 수 없다.** 전 저장소에 `Host(`iam.…`)` 라우터가
#       하나도 없다(iam 의 라우터는 kafka/grafana 관측 도구 둘뿐). 그런데
#       `OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://iam.local}` 이 **6개 compose 의
#       기본값**이다 — 아무도 서빙하지 않는 매달린 호스트명이었다.
#
#   (2) **다른 프로젝트가 iam 을 이름으로 찾을 수 없다.** wms/scm/… 는 traefik-net 에
#       있고 iam 앱은 iam-e2e 에 있다. `demo.env` 의
#       `WMS_OIDC_ISSUER_URL=http://iam-gateway-service:8080` 은 닿지 않는 이름이었다.
#
# ⇒ **통합 데모의 도메인 간 OIDC 배선은 한 번도 동작한 적이 없다.** 96 컨테이너가
#    전부 healthy 로 떠도 로그인은 불가능하다 — healthy 는 usable 을 뜻하지 않는다.
#
# 왜 e2e 파일을 직접 고치지 않는가
# -----------------------------------------------------------------------------
# `docker-compose.e2e.yml` 은 **CI 소유**다. 거기에 Traefik 라벨과 traefik-net 을
# 넣으면 CI 가 Traefik 을 띄우도록 강요받는다(띄우지 않는다). "프로젝트 compose 는
# 그대로 두고 데모 토폴로지는 데모 파일이 책임진다" — `demo.env` 와 같은 원칙이다.
# =============================================================================

# -----------------------------------------------------------------------------
# iam 이 발급하는 iss 를 소비자와 일치시킨다
# -----------------------------------------------------------------------------
# `docker-compose.e2e.yml` 은 `OIDC_ISSUER_URL: http://auth-service:8081` 을
# **리터럴로** 박아 둔다(`${...}` 가 아니다) → demo.env 의 셸 env 로는 바뀌지 않는다.
# 그대로 두면 iam 은 `iss=http://auth-service:8081` 을 발급하는데 소비자(scm/fan/
# finance/erp/wms/console)는 `http://iam.${DEMO_DOMAIN}` 을 기대한다 → **전 도메인 401**.
#
# issuer 는 문자열 비교이자 브라우저가 도달할 주소이고, token/jwks 는 실제 fetch 다.
# 그래서 issuer 만 공개 호스트명으로 올리고, fetch 대상은 컨테이너 DNS 로 못박는다
# (auth-service 의 self-call 이 굳이 Traefik 을 한 번 더 타지 않도록).
x-iam-oidc: &iam-oidc
  OIDC_ISSUER_URL: http://iam.${DEMO_DOMAIN:-local}
  OIDC_JWK_SET_URI: http://auth-service:8081/oauth2/jwks
  OIDC_TOKEN_URI: http://auth-service:8081/oauth2/token

# -----------------------------------------------------------------------------
# 재시작 정책 (TASK-MONO-534)
# -----------------------------------------------------------------------------
# 🔴 iam 의 **앱 5개는 어떤 compose 파일에서도 `restart:` 를 받지 않는다.** base
# (`projects/iam-platform/docker-compose.yml`)는 인프라만 갖고 있고 — 그 값은 병합으로
# 살아남아 mysql·redis·kafka·관측 9개가 재시작을 넘긴다 — 앱은 CI 하네스
# (`docker-compose.e2e.yml`)에만 정의되므로 상속받을 것이 없다.
#
# 실측(2026-08-15, VM 재시작): ecommerce 33/33 · console 2/2 · traefik 1/1 · iam 인프라
# 9/9 가 스스로 복귀했고 **iam 앱은 0/5** 였다. `docker inspect` = `ExitCode 255 ·
# OOMKilled=false · restart=no`, `FinishedAt` 이 VM 을 내린 시각 ⇒ 크래시가 아니라
# **아무도 올리라고 하지 않은 것**이다. 그리고 안 돌아온 것이 하필 이 모노레포의 OIDC
# IdP 라, 결과는 `projects.sh` 가 `MONO-358` 로 이름 붙인 그 상태다 —
# **컨테이너가 전부 healthy 인데 로그인만 불가능.** 노트북 절전·호스트 업데이트·도커
# 재시작이 전부 같은 결과를 낸다.
#
# 🔴 **고칠 자리가 여기인 이유**: `docker-compose.e2e.yml` 은 CI 하네스이고 거기서는
# 재시작이 **없는 것이 옳다**(앱이 죽으면 런이 실패해야 하지 조용히 되살아나면 안 된다).
# 거기에 넣으면 CI 가 크래시를 재시작으로 가린다 — 결함을 고치려다 탐지기를 끄는 것이다.
# 이 오버레이는 **데모 전용**이라 CI 를 건드리지 않고 같은 5개에 정책을 얹을 수 있다.
#
# 🔵 형제 프로젝트가 이미 옳다: wms 는 `x-wms-app-common` 앵커에 `restart:
# unless-stopped` 를 담아 앱 7개가 그것을 머지한다(실효 정책 실측 확인). 이 파일은
# 서비스별로 얹는다 — CI 파일을 안 건드리는 쪽을 택했기 때문이다.
#
# 🔵 **`unless-stopped` 이지 `always` 가 아니다.** `demo-down.sh` 로 명시적으로 내린
# 스택이 도커 재시작에 되살아나면 안 된다.
#
# ⚠️ 이것은 *"놔두면 돌아온다"* 를 만들 뿐 *"즉시 쓸 수 있다"* 를 만들지 않는다 —
# 같은 재시작에서 `iam-kafka` 가 healthy 가 되기까지 약 8분이 걸렸고 앱들은 그것을
# 기다린다(워크스루 § 7 참조).
# -----------------------------------------------------------------------------

services:
  # 신원 엣지. 브라우저가 OIDC 인가 엔드포인트로 리다이렉트되어 **도달해야 하는**
  # 유일한 iam 표면이다.
  gateway-service:
    restart: unless-stopped
    environment: *iam-oidc
    networks:
      iam-e2e: null
      traefik-net:
        # demo.env 가 참조하는 이름. compose 프로젝트가 `-p iam` 이라 실제 컨테이너는
        # `iam-gateway-service-1` 이 되므로, 별칭 없이는 이 이름이 해소되지 않는다.
        aliases:
          - iam-gateway-service
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.iam.rule=Host(`iam.${DEMO_DOMAIN:-local}`)"
      - "traefik.http.routers.iam.entrypoints=web"
      - "traefik.http.services.iam.loadbalancer.server.port=8080"

  # ---------------------------------------------------------------------------
  # auth-service — OIDC 브라우저 엣지 (실측이 설계를 뒤집은 자리)
  # ---------------------------------------------------------------------------
  # 처음엔 "브라우저는 게이트웨이만 통하면 된다"고 봤다. 게이트웨이의 public-paths 에
  # `GET:/oauth2/**` 가 이미 있으니 인가 엔드포인트는 통과할 것이라고. **EC2 실측이
  # 그걸 반증했다.** 등록된 redirect_uri 로 게이트웨이를 통해 authorize 를 치면:
  #
  #     HTTP/1.1 302
  #     Location: http://auth-service:8081/login      ← 내부 컨테이너 DNS 가 새어나온다
  #
  # SAS 는 로그인 리다이렉트를 **자기가 보는 요청의 호스트**로 만든다. 게이트웨이는
  # `http://auth-service:8081` 로 프록시하므로 SAS 가 보는 호스트가 그 이름이다.
  # 브라우저는 이 이름을 해소할 수 없다 ⇒ 로그인 화면에 도달하지 못한다.
  # (그래서 동작하는 CI e2e 는 Traefik 을 아예 우회해 `auth-service:8081` 을 issuer 로
  #  쓴다 — 즉 **`iam.local` Traefik 경로의 콘솔 로그인은 원래부터 동작한 적이 없다.**)
  #
  # 게다가 게이트웨이는 `/login` 자체에 라우트가 없어 404 다 — SAS 의 로그인 폼은
  # 게이트웨이 뒤에서 도달 불가능하다.
  #
  # 고치는 방법은 둘.
  #   (a) 게이트웨이가 X-Forwarded-* 를 이해하고 재발신하도록 — 프록시 2홉. Traefik →
  #       게이트웨이 → SAS 각 홉이 원본 Host 를 보존해야 해서 깨지기 쉽다.
  #   (b) **브라우저용 OIDC 경로만 Traefik 에서 auth-service 로 직행** — 1홉.
  #       `X-Forwarded-Host` 가 정확히 `iam.${DEMO_DOMAIN}` 이 되고, SAS 는 브라우저가
  #       해소 가능한 절대 URL 을 만든다.
  # (b) 를 택한다. 게이트웨이 라우터와 **같은 호스트명**을 쓰되 PathPrefix 로 좁히고
  # priority 를 높여 앞세운다 — 호스트가 하나여야 SAS 세션 쿠키(JSESSIONID)가
  # authorize → /login → authorize 왕복 내내 유지된다.
  #
  # `SERVER_FORWARD_HEADERS_STRATEGY: FRAMEWORK` 가 (b) 의 **동작 조건**이다. 이게
  # 없으면 Spring 은 X-Forwarded-* 를 무시하고 다시 내부 호스트로 리다이렉트한다.
  # auth-service 의 application.yml 에는 `server.forward-headers-strategy` 가 없으므로
  # 제품 코드를 건드리지 않고 데모에서만 env 로 켠다. (가드 (l) 이 이 쌍을 지킨다.)
  #
  # issuer 와 jwk-set-uri 의 분리가 나머지 절반이다:
  #   issuer      = 문자열 비교 + 브라우저가 갈 주소 → http://iam.${DEMO_DOMAIN}
  #   jwk-set-uri = 실제 fetch                      → 컨테이너 DNS http://auth-service:8081/...
  # 뒤집으면 둘 다 깨진다. jwk-set-uri 를 공개 호스트명으로 두면 **AWS 가 인스턴스의
  # 자기 공인 IP 로 되돌아오는 트래픽을 라우팅하지 않아**(IGW hairpin 부재) fetch 가
  # 죽고, issuer 를 컨테이너 DNS 로 두면 브라우저가 인가 엔드포인트에 도달하지 못한다.
  auth-service:
    restart: unless-stopped
    environment:
      <<: *iam-oidc
      SERVER_FORWARD_HEADERS_STRATEGY: FRAMEWORK
      # -----------------------------------------------------------------------
      # assume-tenant 의 배정 확인 홉 (TASK-MONO-505)
      # -----------------------------------------------------------------------
      # 토큰 발급 시점에 auth-service 가 admin-service 의
      # `GET /internal/operator-assignments/check` 를 호출해 운영자가 그 테넌트에
      # 배정돼 있는지 본다. `docker-compose.e2e.yml` 은 이 URL 을 주지 않으므로
      # application.yml 의 기본값 `http://localhost:8084` 로 떨어지고, 그 자리에는
      # 아무것도 없다.
      #
      # 🔴 그 실패가 **보안 판정으로 위장한다.** 이 경로는 fail-closed 라
      # ConnectException 이 `denied` 로 변환되고, 콘솔은 그걸 그대로 받아
      # `TENANT_FORBIDDEN` 을 띄운다 — 데이터도 배정도 멀쩡한데 "이 테넌트를 고를 수
      # 없다" 고 말한다. 실측 로그(MONO-505 착수 시 통합 데모에서 재현):
      #
      #   assume-tenant assignment check failed (fail-closed deny):
      #     GET http://localhost:8084/internal/operator-assignments/check → ConnectException
      #
      # 파급은 데모 전체다: **테넌트 전환이 불가능하므로 콘솔의 도메인 운영 섹션이
      # 하나도 열리지 않는다.** 컨테이너는 전부 healthy 이고 로그인도 되므로,
      # 이 배선이 없으면 데모는 "로그인은 되는데 아무것도 안 보이는" 상태가 된다.
      #
      # 포트는 **8085** 다. application.yml 의 기본값 `localhost:8084` 를 보고 8084 로
      # 적었다가 같은 ConnectException 을 한 번 더 받았다 — 컨테이너가 실제로 여는
      # 포트는 `docker exec … netstat` 로 확인한 8085 이고(호스트 매핑 18085),
      # console-bff 의 fed-e2e 배선이 쓰는 값과도 일치한다. **기본값 포트는 그 서비스가
      # 실제로 듣는 포트가 아니다.**
      ADMIN_SERVICE_URL: http://admin-service:8085
    networks:
      iam-e2e: null
      traefik-net:
        aliases:
          # 다른 도메인의 리소스 서버가 JWKS 를 이 이름으로 직접 fetch 한다.
          - iam-auth-service
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      # 브라우저가 밟는 OIDC 표면만. priority 를 게이트웨이 라우터보다 높여
      # `Host(iam.*)` 전체 매칭을 앞선다(Traefik 기본 priority = rule 길이).
      #
      # `/signup` 이 load-bearing 이다(TASK-MONO-380). 갓 부팅한 데모의 credentials
      # 테이블은 비어 있으므로 **가입이 유일한 입구**다. 이 규칙이 경로를 열거하는데
      # 처음에는 /signup 이 빠져 있었고, 그러면 요청이 iam 게이트웨이 라우터로 떨어져
      # 404 가 된다 — **로그인 폼 자신이 /signup 으로 링크를 거는데.** 컨테이너는 전부
      # healthy 하고 /login 도 200 인데 **아무도 데모에 로그인할 수 없다.**
      # 가드 (p) 가 템플릿의 링크와 이 규칙을 대조한다 — 손으로 열거하면 또 드리프트한다.
      - "traefik.http.routers.iam-oidc.rule=Host(`iam.${DEMO_DOMAIN:-local}`) && (PathPrefix(`/oauth2`) || PathPrefix(`/login`) || PathPrefix(`/signup`) || PathPrefix(`/.well-known`))"
      - "traefik.http.routers.iam-oidc.priority=1000"
      - "traefik.http.routers.iam-oidc.entrypoints=web"
      - "traefik.http.services.iam-oidc.loadbalancer.server.port=8081"

  # account/admin/security 도 콘솔 BFF 와 다른 도메인이 이름으로 찾는다.
  account-service:
    restart: unless-stopped
    environment: *iam-oidc
    networks:
      iam-e2e: null
      traefik-net:
        aliases:
          - iam-account-service

  admin-service:
    restart: unless-stopped
    environment:
      <<: *iam-oidc
      # GAP OIDC subject-token validator (TASK-MONO-456). admin-service verifies
      # the platform-console-web access token presented to
      # POST /api/admin/auth/token-exchange — the operator-token swap the console
      # login performs AFTER the OIDC form, on the way to the shell. The validator
      # is IamOidcProperties, @ConfigurationProperties(prefix="admin.oidc"); it is
      # a SEPARATE trust anchor from *iam-oidc above (that is the resource-server
      # jwt: OIDC_ISSUER_URL / OIDC_JWK_SET_URI). Without these two the validator
      # falls back to its localhost:8081 defaults — the JWKS fetch dies and the
      # iss check fails → 401 "Subject token verification failed", so login never
      # reaches /dashboards/overview even though every container is healthy.
      #   issuer   = string-compared to the token iss → PUBLIC host, identical to
      #              what auth-service mints as iss via *iam-oidc OIDC_ISSUER_URL.
      #   jwks-uri = an actual fetch → CONTAINER DNS, the same /internal/auth/jwks
      #              the gateway-service already consumes in docker-compose.e2e.yml
      #              (public host would die on AWS: no IGW hairpin).
      # ADMIN_OIDC_* binds admin.oidc.* by Spring relaxed binding; the names mirror
      # platform-console/docker-compose.e2e.yml, the canonical wiring of this same
      # validator for the console login flow (sibling parity).
      ADMIN_OIDC_ISSUER: http://iam.${DEMO_DOMAIN:-local}
      ADMIN_OIDC_JWKS_URI: http://auth-service:8081/internal/auth/jwks
    networks:
      iam-e2e: null
      traefik-net:
        aliases:
          - iam-admin-service

  security-service:
    restart: unless-stopped
    environment: *iam-oidc
    networks:
      iam-e2e: null
      traefik-net:
        aliases:
          - iam-security-service

networks:
  # base compose(`projects/iam-platform/docker-compose.yml`)가 이미 external 로
  # 선언하지만, 이 오버레이만 단독으로 렌더될 때를 위해 여기서도 선언한다.
  traefik-net:
    external: true
    name: traefik-net
