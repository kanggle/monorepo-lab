# =============================================================================
# infra/demo/scm-identity.override.yml — scm 백엔드를 신원 평면에 연결 (TASK-MONO-507)
# =============================================================================
# 근거 전문은 infra/demo/erp-identity.override.yml 헤더에 있다(같은 결함, 같은 원인).
# 요약: 이 4개는 OIDC 리소스 서버라 디코드 시점에 JWKS 를 실제로 fetch 하는데,
# 데모가 주입하는 `iam-auth-service` 는 traefik-net 위에만 있는 alias 라서
# 프로젝트 사설망에만 있던 이 서비스들에게는 존재하지 않는 이름이었다. UnknownHost 를
# Spring 이 fail-closed 로 401 로 바꾸므로, 게이트웨이를 통과한 좋은 토큰이 뒤에서 죽었다.
#
# scm 은 erp 와 함께 실측된 것이 아니라 **동일 구조임을 확인**해서 포함했다
# (TASK-MONO-507 AC-4 형제 파리티): 4개 서비스 전부 application.yml 에
# `jwk-set-uri: ${OIDC_JWK_SET_URI:${JWT_JWKS_URI:...}}` 를 들고 있고, compose 는
# 그 env 를 주입하며, networks 는 `scm-platform-net` 하나뿐이었다.
# =============================================================================
services:
  procurement-service:
    networks:
      - traefik-net

  demand-planning-service:
    networks:
      - traefik-net

  logistics-service:
    networks:
      - traefik-net

  inventory-visibility-service:
    networks:
      - traefik-net

  # ---------------------------------------------------------------------------
  # supplier-mock (TASK-SCM-BE-060) — 데모 테넌트를 알려 준다.
  #
  # 🔴 왜 알려 줘야 하나: ack 웹훅(`SupplierAckWebhookRequest`)은 `tenantId` 를
  # **필수**로 요구하는데, 제출 페이로드(`RestSupplierAdapter.toSupplierPayload`)는
  # poId/poNumber/supplierId/currency/totalAmount/lines 만 보낸다. 실제 공급사라도
  # 그 값을 알 길이 없다 — 그것은 구매자 쪽 파티션 키다. 그래서 대역 밖으로 주입한다.
  #
  # 데모 시드는 `demo-corp` 를 assume 한 운영자 토큰으로 PO 를 만들므로 그 PO 들의
  # `tenant_id` 는 `demo-corp` 다. 프로젝트 기본값(`scm`)을 그대로 두면 ack 가
  # **다른 테넌트의 PO 를 찾다가** 실패하고 PO 는 SUBMITTED 에 멈춘다.
  # ---------------------------------------------------------------------------
  supplier-mock:
    environment:
      ACK_TENANT_ID: ${SUPPLIER_MOCK_ACK_TENANT_ID:-demo-corp}
