# =============================================================================
# infra/demo/console-vercel.override.yml — 데모에서 console-web 을 띄우지 않는다
# (TASK-MONO-627 / ADR-MONO-067 단계 3)
# =============================================================================
# 방문자 경로는 `https://console.hubwang.com`(Vercel)로 옮겨갔다. 형제 둘(web-store =
# `ecommerce-vercel.override.yml` · fan-platform-web = `fan-vercel.override.yml`)과
# **같은 기전 · 같은 이유**이고, 이것이 `ADR-MONO-067` 단계 3 의 마지막 조각이다.
#
# 🔵 **선행이 충족된 것을 확인하고 얹었다** — `TASK-MONO-624` 기동 창(2026-09-05 UTC,
#    부팅 #1·#2)이 Vercel 콘솔의 OIDC 왕복을 **세션까지** 실측했다:
#      /api/auth/login → 307 auth.hubwang.com/oauth2/authorize (PKCE S256)
#      → /login 200 → 콜백(state 가 쿠키 보관값과 바이트 동일) → 세션 쿠키 5종
#      → 보호 화면이 세션 有 200 / 無 307→/login 으로 **갈린다**
#    그리고 부팅 #2 에서 공인 IP 가 `3.38.133.85` → `43.203.143.165` 로 바뀌었는데
#    **아무것도 안 고치고** 같은 왕복이 성립했다(`ADR-MONO-069` 축 ② 해소).
#    ⇒ Vercel 판이 죽어 있는데 데모 사본을 끄면 방문자는 **어느 쪽에서도** 그 화면을
#    못 본다 — 그 조건이 여기서 비로소 거짓이 됐다. 형제 둘이 지킨 순서와 같다.
#
# 🔵 2026-09-06 UTC 재측정(음성 대조군 포함):
#      console.hubwang.com          307 → /dashboards/overview
#      nosuch-<임의>.<apex>          404   ← 대조군 ⇒ 위 307 은 와일드카드가 아니다
#    🔴 대조군 이름을 **리터럴로 적지 마라** — `scripts/check-public-domains.sh` 가
#       «정본에 없는 호스트명» 으로 문다(TASK-MONO-585 가 옆 파일에서 먼저 밟았다).
#
# -----------------------------------------------------------------------------
# 🔴 이 억제가 **영구히 열화시키는 것** — 적어 두고 넘긴다
# -----------------------------------------------------------------------------
# `TASK-MONO-585` § 알려진 한계: `console-bff` 는 공개 호스트명이 없고(TASK-MONO-362 가
# 그 Traefik 라우터를 일부러 없앴다 — `api-gateway-policy.md` L14), Vercel 콘솔은 그것을
# **못 부른다.** 영향 레그 셋뿐이다:
#
#   운영 개요 합성   /dashboards/overview
#   도메인 상태 합성 /dashboards/health · /console
#   알림 인박스      /api/console/notifications/**
#
# 🔵 셋 다 실패를 **상태로 표현**한다(`bffUnavailable: true` / 502 `BAD_GATEWAY` 봉투)
#    — `ADR-MONO-067` 이 요구한 *"백엔드 없는 상태를 앱이 표현해야 한다"* 를 만족한다.
# 🔵 나머지 6개 도메인 화면(iam·wms·scm·finance·erp·ecommerce)은 BFF 를 안 지난다
#    (`ADR-MONO-017` D3.B — console-web → 도메인 게이트웨이 **직접**) ⇒ 영향 없다.
# 🔴 그러므로 *"데모 호스트 콘솔이 더 온전하니 옮기지 말자"* 는 **과장이다**
#    (`TASK-MONO-625` 가 한 번 그렇게 말했다가 철회했다).
# 🔴 고치려면 BFF 에 공개 경로를 주거나(엣지 노출 금지에 정면으로 걸린다) 합성을 콘솔
#    서버로 옮겨야 하고 **둘 다 아키텍처 결정**이다 — 이 파일의 권한 밖이다.
#
# -----------------------------------------------------------------------------
# 🔴 왜 base compose 에서 서비스를 «지우지» 않는가
# -----------------------------------------------------------------------------
# `projects/platform-console/docker-compose.yml` 은 데모 전용이 아니다. 지우면 데모만이
# 아니라 로컬(`pnpm console:up`, `package.json:77`)이 같이 죽는다. 그래서 억제는
# **데모 체인에만** 얹는다.
#
# -----------------------------------------------------------------------------
# 🔵 기전: 오버라이드가 `profiles:` 를 «추가» 하면 그 서비스는 렌더에서 빠진다
# -----------------------------------------------------------------------------
# compose 는 서비스를 이름으로 병합하므로, base 에 없던 `profiles:` 를 여기서 붙이면
# 그 서비스는 프로파일이 켜졌을 때만 나타난다. 그 프로파일은 **아무도 켜지 않는다.**
#
# 🔴 다른 후보를 왜 안 골랐는지 — **형제에서 상속하지 않고 콘솔에서 다시 확인했다**
#    (`TASK-MONO-618` AC-1 이 그 재확인을 요구하고, 이 티켓 AC-1 이 그것을 물려받았다):
#   · `deploy.replicas: 0` — 서비스가 **렌더에는 남는다**. 가드가 렌더를 보는 한
#     "억제됐다" 를 판정할 수 없고, 판정할 수 없는 억제는 조용히 되돌아간다.
#   · `demo-up.sh` 에 `--scale console-web=0` — `docker compose config` 로 **안 보인다**.
#     기전과 술어가 어긋나면 가드는 영원히 공허하다.
#   · base 에 `profiles:` — 로컬 기본 동작을 바꾼다.
#
# -----------------------------------------------------------------------------
# 🔴🔴 형제와 **다른 점** — 이 억제만이 부팅 판정의 계측기를 건드린다
# -----------------------------------------------------------------------------
# 형제 둘을 억제했을 때는 데모 호스트가 서빙하는 방문자 표면이 **아직 남아 있었다**
# (console). 이번엔 남지 않는다 ⇒ `demo-up.sh` 의 HTTP 표면 프로브 대상이 0 이 된다.
#
# 🔴 그 상태에서 `SURFACE_FLOOR` 를 0 으로 내리면 루프가 **빈 채로 통과**하고,
#    «표면이 정상» 과 «측정이 죽었다» 가 구별되지 않는다 — `TASK-MONO-552` AC-3 이
#    산 명제 자체가 공허해진다. 그래서 이 PR 은 하한을 안 내리고 **프로브 대상을
#    옮겼다**: `iam` 의 `/login`(데모 IdP 로그인 폼).
# 🔵 그것이 임의의 대체물이 아닌 이유 — 억제 뒤 방문자가 **여전히 데모 호스트를 밟는
#    유일한 홉**이기 때문이다(Vercel 콘솔 → `auth.hubwang.com` → `http://iam.<도메인>`;
#    `infra/demo/auth-forwarder/src/app/[[...path]]/route.ts` 의 `servicePrefix: 'iam'`).
#    상세와 「왜 a·c 가 아닌가」는 `demo-up.sh` 의 SURFACE_FLOOR 주석에 있다.
#
# -----------------------------------------------------------------------------
# 🔵 이 파일이 «한 곳» 이다
# -----------------------------------------------------------------------------
# 억제 선언은 여기 한 줄뿐이고, 체인 등록은 `infra/demo/projects.sh` 의 [console] 행
# 하나다. 두 가드가 그 둘의 효력을 확인한다:
#   · (z31) — **렌더**로 (형제 (z19)·(z28)과 **같은 함수**를 한 줄로 호출한다.
#     `TASK-MONO-618` 이 그 함수를 만들면서 *"단계 3(console)이 오면 한 줄이다"* 라고
#     적었고, 이 파일이 그 한 줄이다)
#   · `check-suppressed-containers.sh` — **도는 컨테이너**로 (TASK-MONO-617).
#     🔵 그 판정자는 억제 대상을 **목록이 아니라 체인에서 유도**하므로
#     (`억제 = 렌더(체인 − infra/demo/*.override.yml) − 렌더(체인)`),
#     이 파일은 이름을 어디에도 안 적어도 **자동으로** 그 모집단에 들어간다.
#
# 🔴 이 파일을 지우면 데모가 다시 사본을 서빙한다 — 그리고 (z31)이 문다.
# =============================================================================

services:
  console-web:
    # 아무도 켜지 않는 프로파일. 이름이 곧 사유다. (형제와 같은 이름을 쓴다 —
    # 서로 다른 이름을 쓰면 "왜 다르지" 가 새 질문이 된다.)
    profiles:
      - vercel-migrated
