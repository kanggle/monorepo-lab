# =============================================================================
# infra/demo/wms-devseed.override.yml — wms 마스터 데이터를 데모에서 켠다 (TASK-MONO-510)
# =============================================================================
# 🔴 왜 시드 스크립트가 아니라 compose 인가
# -----------------------------------------------------------------------------
# wms 마스터 데이터(창고·존·로케이션·SKU·거래처)는 **이 저장소가 이미 갖고 있다** —
# 각 서비스의 `src/main/resources/db/seed/V99..V103` 이 고정 UUID 로 심는다. 다만 그
# 위치는 `application-dev.yml` 의 `spring.flyway.locations` 에서만 활성화되고, 데모는
# `dev` 프로파일로 뜨지 않으므로 한 줄도 실행되지 않는다(실측: 5개 테이블 전부 0행).
#
# 그래서 새 SQL 을 쓰지 않는다. 같은 데이터를 시드 스크립트에 복제하면 **두 벌이 갈린다**
# — 이 저장소가 반복해서 당한 모양이다. Flyway 위치만 열어 준다.
#
# 🔴 왜 API 로 못 넣는가 (= `dbexec --why` 를 쓰지 않아도 되는 이유이자, 썼다면 적었을 사유)
# -----------------------------------------------------------------------------
# master-service 의 쓰기는 전부 `@PreAuthorize("hasRole('MASTER_WRITE') or
# hasRole('MASTER_ADMIN')")` 인데, iam 의 `OperatorRoleDerivation` 이 `wms` 엔타이틀먼트로
# 주는 것은 **`MASTER_READ` 까지**다(OUTBOUND/INBOUND/INVENTORY 는 READ+WRITE 를 주는데
# master 만 READ 다 — 비대칭이고 그 이유가 코드에 적혀 있지 않다). 실측:
#
#   POST /api/v1/master/warehouses  (assume demo-corp 운영자)  403 FORBIDDEN
#                                    "Insufficient privileges for this operation"
#   POST /api/v1/master/warehouses  (wms-internal-services-client,
#                                    scope=wms.master.write)   403 (동일)
#     ↑ 워크로드 토큰은 **scope 만** 싣고 role 을 싣지 않는다. master-service 는
#       role 로 인가하므로 scope 는 아무것도 열지 못한다.
#
# → TASK-MONO-514 (AC-8).
#
# 🔴 재측정 함정: 위 두 403 을 **같은 Idempotency-Key 로** 재현하면 두 번째 응답이
# 첫 번째의 저장된 결과와 **타임스탬프까지 동일**하다(멱등 재생). 실제로 그렇게 나와
# "워크로드 클라이언트도 막혔다" 로 결론 낼 뻔했다 — 키를 바꿔 다시 받아야 실측이다.
# (같은 함정을 TASK-MONO-509 가 멤버십 구독에서 먼저 밟았다.)
#
# 🔴 테넌트: wms 는 **데이터에 테넌트가 없다.** 실측으로 `tenant_id` 컬럼을 가진
# 테이블은 5개 DB 통틀어 `outbound_db.outbound_order` **하나뿐**이다. 테넌시는 게이트웨이
# 엣지의 admission(`TENANT_FORBIDDEN`)으로만 강제된다 ⇒ 이 시드가 테넌트를 적지 않는
# 것은 누락이 아니라 스키마가 그렇다. (그래서 `TASK-BE-576` 형태의 "200 + 빈 배열" 위험도
# wms 에는 없다 — AC-0 이 확인하려던 것이 이것이고, 답은 "구조적으로 해당 없음" 이다.)
# =============================================================================
services:
  master-service:
    environment:
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed

  inbound-service:
    environment:
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed

  inventory-service:
    environment:
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed

  # TASK-BE-580: outbound-service was missing from this list because opening
  # `classpath:db/seed` for it would have done nothing — its seed migration sat
  # in `db/dev/` (siblings all use `db/seed/`) and **no** `spring.flyway.locations`
  # anywhere in the repo names `db/dev`, so the file had never executed. It was
  # also the only master-read-model consumer without an `application-dev.yml`.
  # Both are fixed now, so outbound joins its siblings here. Without this entry
  # the demo keeps a 0-row read model even with the migration on the classpath —
  # the demo does not boot with the `dev` profile, which is the whole reason
  # this override file exists.
  outbound-service:
    environment:
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed

  # ---------------------------------------------------------------------------
  # admin-service — 호환 슬림 (TASK-BE-585). 위 네 서비스와 성질이 다르다.
  # ---------------------------------------------------------------------------
  # admin 은 여기서 seed 위치를 열지 않는다 — 자기 시드가 이미 항상 켜지는
  # `db/migration` 안에 있기 때문이다(그래서 이 목록에 없었다). 이 항목이 여는 것은
  # **기존 볼륨의 복구 경로**다.
  #
  # 무슨 일이 있었나: 그 시드가 `V99__seed_dev_data.sql` 이라, 한 번이라도 뜬 admin_db 는
  # **적용된 최고 버전이 99** 가 됐다. 나중에 `ADR-MONO-065` 가 `V3` 를 추가하자 그것이
  # 99 **아래**로 해소되어 out-of-order 가 됐고, Flyway 기본값이 거부하면서 admin-service 가
  # 크래시 루프에 빠졌다(실측 2026-08-14, `TASK-BE-584` AC-0: restarts=12, 대시보드 8개 전건 500).
  #
  # 🔴 파일을 `R__` 로 바꾸는 것만으로는 **기존 DB 가 낫지 않는다.** 결함은 파일이 아니라
  # **이력 테이블**에 있다 — version=99 행이 그대로 남아 `V3` 는 여전히 그 아래다.
  # (`TASK-MONO-524` 가 iam 에서 같은 것을 실측했다 — R__ 전환만 골랐다면 그 티켓의 AC-3 을
  # 통과하지 못했을 것이라고 적고 있다.) 그래서 이 한 줄이 필요하다.
  # 🔵 신선 볼륨에서는 **no-op** 이다 — 적용/해소 순서가 이미 맞다.
  #
  # 🔴 왜 `application.yml` 이 아니라 여기인가: out-of-order 는 순서 보증을 푸는 것이라
  # 프로덕션 정책으로 굳히면 안 된다. 고아 이력 행을 가진 것은 **데모 볼륨**이므로 슬림도
  # 데모에만 둔다.
  #
  # **일몰 조건**: 유통 중인 admin_db 중 `version='99'` 행을 가진 것이 하나도 없으면 이 항목을
  # 지운다. 한 줄로 깨끗해진다(가리키는 시드가 이제 매번 재적용되는 `R__` 이고 전 문장이
  # `ON CONFLICT DO NOTHING` 이라 안전하다):
  #
  #     DELETE FROM flyway_schema_history WHERE version = '99';
  #
  # 선례와 절차: projects/iam-platform/docs/flyway-dev-seed-migrations.md § 6
  admin-service:
    environment:
      SPRING_FLYWAY_OUT_OF_ORDER: "true"
