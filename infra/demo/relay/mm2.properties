# =============================================================================
# infra/demo/relay/mm2.properties — 크로스프로젝트 이벤트 릴레이 (TASK-MONO-511)
# =============================================================================
# ADR-MONO-062 ACCEPTED — B: 프로젝트별 Kafka 격리를 유지한 채, 경계를 넘어야 하는
# 토픽만 각 소비자 클러스터로 복제한다. 소비자는 지금처럼 자기 `kafka:9092` 를 읽는다.
#
# ## 구현체 선택 (ADR 이 구현 AC 로 위임한 rider)
#
# MirrorMaker 2 를 골랐다. 직접 만든 브리지가 아니라:
#   * 코드가 0 줄이다. 이미지는 `apache/kafka:3.7.0` 로, **네 브로커가 쓰는 바로 그
#     이미지**다(새로 받을 것도 없다).
#   * MM2 는 원래 다중 클러스터 도구다 — 클러스터 4개와 흐름 5개를 **한 프로세스**가
#     처리한다. 흐름마다 컨테이너를 띄우면 데모 메모리 예산(TASK-MONO-399)이 그만큼
#     깎인다.
#   * 오프셋/재시도/파티션 매핑은 이미 풀린 문제다. 브리지를 쓰면 그 전부를 다시 짜고,
#     "재시작 시 중복 전달"(티켓 Edge Case)을 직접 증명해야 한다.
#
# ## 🔴 IdentityReplicationPolicy — 이것이 없으면 전부 조용히 실패한다
#
# MM2 의 기본 정책(`DefaultReplicationPolicy`)은 대상 클러스터에 토픽을 **`<source>.` 접두를
# 붙여** 만든다 — `account.created` 는 ecommerce 쪽에 `iam.account.created` 로 도착한다.
# 소비자는 `account.created` 를 구독하므로 **토픽은 생기고 데이터는 흐르는데 아무도 안
# 읽는다.** 그건 이 티켓이 고치려는 결함과 **똑같이 생겼다**(빈 토픽이 배선처럼 보인다).
# 그래서 이름을 보존하는 IdentityReplicationPolicy 를 쓴다.
#
# ## 🔴 이름을 보존하면 순환이 문제가 된다 — 여기서는 왜 안전한가
#
# 접두 정책은 순환(a→b→a)을 접두로 끊는다. Identity 정책에는 그 방어가 없다. 이 배선에는
# 실제로 양방향 쌍이 있다: `ecommerce→wms` 와 `wms→ecommerce`.
#
# 안전한 이유는 **화이트리스트가 접두로 서로 소(disjoint)** 이기 때문이다 — wms 로 들어가는
# 것은 `ecommerce.*`/`scm.*` 뿐이고, wms 에서 나가는 것은 `wms.*` 뿐이다. 복제본이 되돌아갈
# 흐름의 화이트리스트에 걸리지 않는다.
# 🔴 이것은 **우연이 아니라 불변식이고**, 지키지 않으면 무한 증식한다.
# `scripts/check-cross-project-topic-relay.sh` 가 그 서로소를 단언한다 — 주석으로 남기면
# 다음 사람이 토픽 하나 추가할 때 이 문단을 안 읽는다.
#
# ## 클러스터 주소가 `<컨테이너명>:9095` 인 이유
#
# 네 브로커가 전부 자기를 `kafka:9092` 로 광고해서, 네 네트워크에 붙는 이 프로세스에게
# 그 이름은 모호하다. `infra/demo/*-relay.override.yml` 이 전역 유일 이름으로 광고하는
# RELAY 리스너를 브로커마다 하나씩 더 달아 둔다. 전문은 그 파일 헤더에 있다.
# =============================================================================

clusters = iam, ecommerce, wms, scm

iam.bootstrap.servers = iam-kafka:9095
ecommerce.bootstrap.servers = ecommerce-kafka:9095
wms.bootstrap.servers = wms-kafka:9095
scm.bootstrap.servers = scm-platform-kafka:9095

# 토픽 이름을 보존한다 (위 § IdentityReplicationPolicy).
replication.policy.class = org.apache.kafka.connect.mirror.IdentityReplicationPolicy

# 데모 클러스터는 전부 단일 브로커다. MM2 의 내부 토픽까지 RF=1 로 내리지 않으면
# 커넥터가 기동 중에 죽는다(RF 3 을 만들 브로커가 없다).
replication.factor = 1
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1
offset.storage.replication.factor = 1
status.storage.replication.factor = 1
config.storage.replication.factor = 1

# 소비자 그룹은 프로젝트마다 다르고 오프셋을 옮길 필요가 없다. 체크포인트/하트비트는
# 대상·원본 클러스터에 토픽만 더 만들 뿐이라 끈다 — 데모에서 "이 토픽은 뭐지" 를
# 늘리지 않는 것도 이 파일의 계약이다.
emit.checkpoints.enabled = false
emit.heartbeats.enabled = false
sync.topic.acls.enabled = false
sync.topic.configs.enabled = false
refresh.topics.interval.seconds = 10

# =============================================================================
# 화이트리스트 — **프로젝트 경계를 넘는 것의 유일한 출처**(ADR-MONO-062 § 구속력 2)
#
# 🔴 5계열 17라우트다. ADR 본문은 "3계열 12토픽" 이라 적었는데, 그 숫자는 발굴 티켓
# (TASK-MONO-511)의 과소계수를 물려받은 것이다 — 재계수 결과 `ecommerce→wms` 2토픽과
# `scm→wms` 2토픽이 더 있었고, 둘 다 티켓도 ADR 도 세지 않았다. 소유자가 정확형으로
# **측정된 5계열 전부**를 골랐다(2026-08-13).
#
# 목록의 근거는 `@KafkaListener` 전수다(자기 프로젝트가 발행하지 않는 토픽을 구독하는
# 리스너 20개). 목록이 리스너와 어긋나면 실패하는 것이 위 체크 스크립트다.
# =============================================================================

# --- iam → ecommerce : 3 토픽 / 리스너 5 -------------------------------------
# user-service(2: created·deleted) · order-service(1: deleted) ·
# product-service(1: status.changed) · notification-service(1: created)
# 🔴 `account.deleted` 가 TASK-BE-258 GDPR 익명화 의무를 실행시키는 이벤트다.
iam->ecommerce.enabled = true
iam->ecommerce.topics = account\.created|account\.deleted|account\.status\.changed

# --- wms → ecommerce : 5 토픽 / 리스너 6 -------------------------------------
# product-service(3) · order-service(1) · shipping-service(2)
wms->ecommerce.enabled = true
wms->ecommerce.topics = wms\.inventory\.adjusted\.v1|wms\.inventory\.received\.v1|wms\.master\.sku\.v1|wms\.outbound\.order\.cancelled\.v1|wms\.outbound\.shipping\.confirmed\.v1

# --- wms → scm : 5 토픽 / 리스너 5 -------------------------------------------
# inventory-visibility-service(3) · demand-planning-service(1) · logistics-service(1)
wms->scm.enabled = true
wms->scm.topics = wms\.inventory\.adjusted\.v1|wms\.inventory\.alert\.v1|wms\.inventory\.received\.v1|wms\.inventory\.transferred\.v1|wms\.outbound\.shipping\.confirmed\.v1

# --- ecommerce → wms : 2 토픽 / 리스너 2 (재계수로 새로 나온 계열) -----------
# outbound-service(2)
ecommerce->wms.enabled = true
ecommerce->wms.topics = ecommerce\.fulfillment\.requested\.v1|ecommerce\.shipping\.manual-confirm-requested\.v1

# --- scm → wms : 2 토픽 / 리스너 2 (재계수로 새로 나온 계열) -----------------
# inbound-service(1 리스너가 2 토픽을 함께 구독한다)
scm->wms.enabled = true
scm->wms.topics = scm\.procurement\.inbound-expected\.v1|scm\.procurement\.inbound-expected\.cancelled\.v1

# 명시적으로 꺼 둔 나머지 방향 — 침묵이 아니라 결정이다.
# 🔵 `ecommerce→iam` 은 재계수에서도 **0건**이다(ecommerce 의 `user.user.withdrawn` 컨슈머
# 둘은 ecommerce 자기 토픽을 읽는다). 나머지는 그 방향으로 구독하는 리스너가 없다.
iam->wms.enabled = false
iam->scm.enabled = false
ecommerce->iam.enabled = false
ecommerce->scm.enabled = false
wms->iam.enabled = false
scm->iam.enabled = false
scm->ecommerce.enabled = false
