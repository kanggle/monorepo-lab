# =============================================================================
# infra/demo/fan-identity.override.yml — fan 백엔드를 신원 평면에 연결 (TASK-MONO-507)
# =============================================================================
# 근거 전문: infra/demo/erp-identity.override.yml 헤더.
#
# fan 이 이 목록에 있는 이유를 적어 둔다. TASK-FAN-FE-014 의 라이브 검증은
# **로그인까지** 를 증명했다(OIDC 왕복, 세션 쿠키, SSR 200). 그 술어는 데이터 레그가
# 살아 있는지를 묻지 않는다 — 로그인은 fan 백엔드의 JWKS 를 한 번도 쓰지 않기 때문이다
# (토큰 발급은 iam 이 하고, fan 서비스는 그 토큰을 **검증할 때** 비로소 JWKS 를 부른다).
# 그래서 같은 결함이 그 검증을 통과한 채 남아 있을 수 있었다. 형제 파리티(AC-4)로
# 확인해 포함한다 — 4개 서비스 전부 `jwk-set-uri` 를 선언하고 networks 는
# `fan-platform-net` 하나뿐이었다.
#
# membership-service 는 JWKS 를 **두 군데**서 읽는다: 공개 체인의
# `${OIDC_JWK_SET_URI:${JWT_JWKS_URI:...}}` 와 내부 체인의
# `${INTERNAL_JWT_JWK_SET_URI:${OIDC_ISSUER_URL:...}/oauth2/jwks}`. 둘 다 같은 IdP 를
# 가리키므로 네트워크 합류 하나로 양쪽이 해소된다.
#
# fan-platform-web 은 이미 traefik-net 에 있다(TASK-FAN-FE-014 이 붙였다).
# =============================================================================
services:
  artist-service:
    networks:
      - traefik-net

  community-service:
    networks:
      - traefik-net

  membership-service:
    networks:
      - traefik-net

  notification-service:
    networks:
      - traefik-net
