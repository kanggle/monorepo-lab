# =============================================================================
# infra/demo/iam-relay.override.yml — iam 브로커에 RELAY 리스너를 더한다 (TASK-MONO-511)
# =============================================================================
# `ADR-MONO-062` ACCEPTED — **B**(릴레이로 필요한 토픽만 복제, 프로젝트 격리 유지).
#
# ## 왜 리스너를 하나 더 다는가 — 이것이 B 의 진짜 난관이다
#
# 네 프로젝트의 브로커가 **전부 자기를 `kafka:9092` 로 광고한다**:
#
#   iam        KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://kafka:9093
#   ecommerce  KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
#   wms        KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://kafka:9093
#   scm        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
#
# 각 프로젝트 안에서는 이것이 옳다 — `kafka` 는 자기 net 에서 자기 브로커로 해소된다.
# 그런데 릴레이는 **네 네트워크에 동시에** 붙어야 하고, 거기서 `kafka` 는 **모호하다**.
# 🔴 그리고 이 모호함은 부트스트랩 주소를 컨테이너명(`iam-kafka:9092`)으로 정확히 적어도
# 사라지지 않는다 — Kafka 클라이언트는 부트스트랩 응답으로 받은 **advertised listener** 로
# 다시 접속하기 때문이다. 즉 주소를 옳게 적고도 **다른 클러스터에 연결될 수 있고**, 그때
# 증상은 "연결 실패" 가 아니라 **조용한 오배송**이다.
#
# 그래서 브로커마다 **전역적으로 유일한 이름으로 광고하는 리스너**를 하나 더 단다:
#
#   RELAY://iam-kafka:9095      (여기)
#   RELAY://ecommerce-kafka:9095
#   RELAY://wms-kafka:9095
#   RELAY://scm-platform-kafka:9095
#
# ## 이것은 A 가 아니다 (경계를 분명히)
#
# `ADR-MONO-062` 는 *"브로커 간 네트워크 경로를 뚫지 않는다 — `traefik-net` 에도, 새 전용
# 망에도 브로커를 올리지 않는다"* 를 구속력으로 못박았다. 이 파일은 그것을 지킨다:
#
#   * 브로커는 **자기 프로젝트 네트워크에 그대로 있다.** 여기서 네트워크를 추가하지 않는다.
#   * 새 리스너는 그 **같은 네트워크 위**에 있다. 그 네트워크에 붙은 것(=릴레이)만 닿는다.
#   * 브로커끼리는 여전히 서로 못 본다. 릴레이만 각각을 본다.
#   * 소비자 코드·설정은 그대로 `kafka:9092` 를 읽는다. 🔴 소비자에 두 번째 브로커 주소가
#     들어가기 시작하면 그건 B 가 아니라 A 다(ADR § 무엇이 구속력을 갖나 3).
#
# ## 왜 프로젝트 compose 를 직접 안 고치고 override 인가
#
# 릴레이는 **데모 합성(composition)의 관심사**이지 프로젝트의 관심사가 아니다. 프로젝트
# compose 는 단독으로도 옳아야 하고, 실제로 지금 옳다. `*-identity.override.yml` 이 같은
# 이유로 존재한다(TASK-MONO-507).
#
# 🔴 **대가**: compose 는 `KAFKA_ADVERTISED_LISTENERS` 같은 스칼라를 **병합하지 않고
# 치환한다.** 그래서 아래 값은 base 의 값을 **전부 다시 적은 뒤** RELAY 를 덧붙인 것이다.
# base 가 바뀌면 여기가 조용히 낡는다 ⇒ `scripts/check-cross-project-topic-relay.sh` 가
# base 의 리스너 목록이 이 값의 **접두**인지를 검사한다. 손으로 맞추라고 적어 두는 대신
# 틀어지면 실패하게 해 둔 것이다.
# =============================================================================
services:
  kafka:
    expose:
      - "9092"
      - "9093"
      - "9095"
    environment:
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094,RELAY://0.0.0.0:9095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://kafka:9093,RELAY://iam-kafka:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,RELAY:PLAINTEXT
