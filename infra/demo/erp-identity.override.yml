# =============================================================================
# infra/demo/erp-identity.override.yml — erp 백엔드를 신원 평면에 연결 (TASK-MONO-507)
# =============================================================================
# 이 파일이 고치는 것은 **토큰이 아니라 DNS** 다.
#
# erp 의 백엔드 4개는 전부 OIDC 리소스 서버다(각자 ServiceLevelOAuth2Config —
# "게이트웨이 뒤 두 번째 층이고 load-bearing 이다" 라고 그 클래스가 스스로 적어 뒀다).
# 리소스 서버는 디코드 시점에 JWKS 를 **실제로 fetch** 하고, 데모는 그 주소로
# `http://iam-auth-service:8081/oauth2/jwks` 를 주입한다(infra/demo/demo.env).
#
# 그런데 `iam-auth-service` 는 **traefik-net 위에만 존재하는 network alias** 다
# (infra/demo/iam-traefik.override.yml 에서 auth-service 컨테이너에 붙인다). 그리고
# 통합 데모에서 traefik-net 에 합류하는 것은 각 프로젝트의 gateway-service 뿐이었다.
# 즉 이 4개 서비스에게 그 이름은 **존재하지 않았다**.
#
# 실측(TASK-MONO-507 AC-0):
#
#   $ docker exec erp-platform-masterdata getent hosts iam-auth-service
#   (없음)
#   masterdata 로그: AuthenticationServiceException: An error occurred while
#     attempting to decode the Jwt: Couldn't retrieve remote JWK set:
#     I/O error on GET "http://iam-auth-service:8081/oauth2/jwks": iam-auth-service
#
# Spring 은 그 UnknownHost 를 **fail-closed 로 401 "Authentication required"** 로
# 바꾼다. 그래서 증상이 "게이트웨이가 assumed 토큰을 거부한다" 로 보였다 — 실제로는
# 게이트웨이는 토큰을 **받아들여** 뒤로 넘겼고, 뒤에서 죽은 것이다. 두 응답을 나란히
# 두면 이 구분이 분명해진다(같은 게이트웨이, 같은 경로):
#
#   base 토큰(tenant_id=iam)     → 403 TENANT_FORBIDDEN "tenant_id 'iam' is not allowed"
#   assumed 토큰(tenant_id=데모)  → 401 UNAUTHORIZED     "Authentication required"
#
# 403 은 **엣지의 테넌트 게이트**가 낸 것이다. 401 을 받으려면 그 게이트를 통과해야
# 한다. 즉 401 은 토큰이 나쁘다는 증거가 아니라, 토큰이 **좋다**는 증거였다.
#
# 왜 폴백 기본값으로도 안 되는가
# -----------------------------------------------------------------------------
# 이 서비스들의 코드 기본값은 `http://iam.local/oauth2/jwks` 다. 그것도 못 쓴다 —
# `iam.local` 은 Traefik 컨테이너의 alias 인데 Traefik 도 traefik-net 에만 있다.
# 로컬에서는 더 나쁘다: Docker 임베디드 DNS 가 **호스트의 hosts 파일**로 폴백해
# `127.0.0.1` 을 돌려주므로, 컨테이너가 **자기 자신에게** 접속한다(실측:
# "can't connect to remote host (127.0.0.1)"). AWS 에서는 그냥 NXDOMAIN 이다.
#
# 왜 프로젝트 compose 가 아니라 오버레이인가
# -----------------------------------------------------------------------------
# 데모는 각 프로젝트 compose 를 byte-unchanged 로 둔다(demo.env 상단 계약). 그리고
# 이것은 **데모 토폴로지의 결과**이지 erp 의 성질이 아니다 — 단일 compose 인
# tests/federation-hardening-e2e 하네스에서는 모든 서비스가 한 네트워크에 있어
# 이 문제가 아예 발생하지 않는다.
#
# 격리에 대한 정직한 대가
# -----------------------------------------------------------------------------
# traefik-net 은 공유 fabric 이므로, 여기 합류한 서비스는 다른 도메인의 게이트웨이도
# 이름으로 부를 수 있게 된다. 도메인 간 격리가 그만큼 느슨해진다. 대안(도메인마다
# IdP 를 사설망에 `docker network connect` 로 밀어넣기)은 격리를 지키지만 **명령형**
# 이라 `docker compose up` 을 직접 한 사람에게는 보이지 않는다. 선언형을 택했다 —
# 데모의 목적은 격리 시연이 아니라 도달이고, 가드 (v) 가 선언을 검사할 수 있다.
# **라우터 라벨은 붙이지 않는다** — ingress 는 여전히 게이트웨이 전용이다
# (scripts/check-gateway-drift.sh 의 I2 가 그것을 지킨다).
# =============================================================================
services:
  masterdata-service:
    networks:
      - traefik-net

  read-model-service:
    networks:
      - traefik-net

  approval-service:
    networks:
      - traefik-net

  notification-service:
    networks:
      - traefik-net
