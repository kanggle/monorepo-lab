# =============================================================================
# infra/demo/ecommerce-mail.override.yml — ecommerce 알림 메일을 데모 메일함(Mailpit)으로 (TASK-MONO-770)
# =============================================================================
# ecommerce notification-service 는 이미 동작하는 SMTP 발송기(`JavaMailSender`)를 갖고 있다:
#
#   projects/ecommerce-microservices-platform/apps/notification-service/src/main/resources/application.yml
#     spring.mail.host: ${MAIL_HOST:localhost}   port: ${MAIL_PORT:1025}
#
# 그런데 **저장소 어디에도 메일 서버가 없었다** — 데모에서 그 발송은 매번 `localhost:1025` 연결 거부로 끝났다.
# TASK-MONO-770 이 IAM 쪽에 Mailpit(`iam-mailpit`, projects/iam-platform/docker-compose.yml)을 두었으므로
# 같은 컨테이너로 보낸다(소유자 승인 «싸다, 같은 컨테이너»).
#
# 🔵 무엇이 바뀌나: 주소 하나와 망 하나.
#   · `MAIL_HOST=iam-mailpit` — 포트는 기본값 1025 그대로(Mailpit 의 SMTP 포트).
#   · `traefik-net` 합류 — `iam-mailpit` 은 iam 프로젝트의 컨테이너라 ecommerce-net 에서는 안 보인다.
#     공유 fabric 인 traefik-net 에서만 이름으로 닿는다(erp-identity.override.yml 이 JWKS 때문에 하는 것과
#     같은 모양이고, 같은 대가 — 도메인 간 격리가 그만큼 느슨해진다 — 를 같은 이유로 받는다).
#   · **라우터 라벨은 붙이지 않는다** — ingress 는 여전히 게이트웨이 전용이다.
# 🔴 Mailpit 은 받기만 하고 릴레이하지 않는다 — 데모 시드의 가짜 주소로 실제 메일이 나가는 일은 없다.
# 🔴 iam 이 안 떠 있으면 이름이 해소되지 않아 발송이 실패한다 — 그 실패는 오늘과 같은 모양이다(연결 실패,
#    알림 서비스는 계속 산다). ecommerce 는 iam 에 하드 의존이라(projects.sh DEPS) 정상 기동에서는 생기지 않는다.
# =============================================================================
services:
  notification-service:
    environment:
      - MAIL_HOST=iam-mailpit
    networks:
      - traefik-net
