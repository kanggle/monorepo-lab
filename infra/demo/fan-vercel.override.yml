# =============================================================================
# infra/demo/fan-vercel.override.yml — 데모에서 fan-platform-web 을 띄우지 않는다
# (TASK-MONO-618 / ADR-MONO-067 단계 4)
# =============================================================================
# 방문자 경로는 `https://fan.hubwang.com`(Vercel)로 옮겨갔다. 형제 축(web-store,
# `ecommerce-vercel.override.yml`)과 **같은 기전 · 같은 이유**다.
#
# 🔵 **선행이 충족된 것을 확인하고 얹었다** — `TASK-MONO-616` 기동 창 #3(2026-09-03)에서
#    `fan.hubwang.com` 로그인 왕복이 **세션까지** 성립했다:
#      POST /api/auth/signin/iam → 302 auth.hubwang.com/oauth2/authorize
#      → /login 200 → 콜백 → GET /api/auth/session
#         = accountId · tenantId=fan-platform · roles=["FAN"]
#    ⇒ `TASK-MONO-586` 이 *"나머지 화면은 D4 가 풀려야 보인다"* 로 남긴 그 D4 가
#    팬 표면에서 닫혔다. Vercel 판이 죽어 있는데 데모 사본을 끄면 방문자는 **어느
#    쪽에서도** 그 화면을 못 본다 — 그 조건이 여기서 비로소 거짓이 됐다.
#
# -----------------------------------------------------------------------------
# 🔴 왜 base compose 에서 서비스를 «지우지» 않는가
# -----------------------------------------------------------------------------
# `projects/fan-platform/docker-compose.yml` 은 데모 전용이 아니다. 지우면 데모만이
# 아니라 로컬(`pnpm fan-platform:up`, `package.json:41-45`)이 같이 죽는다.
# 그래서 억제는 **데모 체인에만** 얹는다.
#
# -----------------------------------------------------------------------------
# 🔵 기전: 오버라이드가 `profiles:` 를 «추가» 하면 그 서비스는 렌더에서 빠진다
# -----------------------------------------------------------------------------
# compose 는 서비스를 이름으로 병합하므로, base 에 없던 `profiles:` 를 여기서 붙이면
# 그 서비스는 프로파일이 켜졌을 때만 나타난다. 그 프로파일은 **아무도 켜지 않는다.**
#
# 🔴 다른 후보를 왜 안 골랐는지 — **형제에서 상속하지 않고 팬에서 다시 확인했다**
#    (`TASK-MONO-618` AC-1 이 그것을 요구한다):
#   · `deploy.replicas: 0` — 서비스가 **렌더에는 남는다**. 가드가 렌더를 보는 한
#     "억제됐다" 를 판정할 수 없고, 판정할 수 없는 억제는 조용히 되돌아간다.
#   · `demo-up.sh` 에 `--scale fan-platform-web=0` — `docker compose config` 로
#     **안 보인다**. 기전과 술어가 어긋나면 가드는 영원히 공허하다.
#   · base 에 `profiles:` — 로컬 기본 동작을 바꾼다.
#
# -----------------------------------------------------------------------------
# 🔴🔴 형제와 **다른 점** — 결제 mock 의 극성이 반대다
# -----------------------------------------------------------------------------
# `infra/demo/demo.env:276-285` 가 근거다:
#
#   ecommerce : 기본 실 Toss  → mock 이 되려면 `demo-pg` 프로파일을 **켠다**
#   fan       : 기본 **목**   → `MockPaymentGatewayAdapter = @Profile("!portone")`
#                              ⇒ mock 이 되려면 `portone` 이 **꺼져** 있으면 된다
#
# ⇒ 가드 (x2) 의 미집행 문구에 `demo-pg` 를 적으면 팬 축에서 **거짓**이 된다.
#    (x2) 는 `verify-demo-wrapper.sh` 에서 이 파일의 억제를 읽고 분기한다.
#
# 🔴🔴 그리고 이 억제가 **(x2) 등식의 한쪽을 없앤다.** 지금까지 팬 프런트는 둘이었고
#    (데모 사본 + Vercel), 데모 사본이 `DEMO_PAYMENT_MOCK` 를 받아 등식을 만족시켰다.
#    억제하면 **Vercel 판이 유일한 팬**이 되는데 `kanggle-fan` 프로덕션 env 에는
#    그 값이 **없다**(2026-09-04 실측: 5개 — OIDC_ISSUER_URL · OIDC_CLIENT_{ID,SECRET}
#    · NEXTAUTH_{SECRET,URL}). ⇒ 🙋 **소유자: `kanggle-fan` 에 `DEMO_PAYMENT_MOCK=1`.**
#    안 넣으면 팬 구독 결제가 **살아남는 표면에서** 죽는다(프런트가 'PortOne 키 미설정'
#    으로 요청 자체를 안 보낸다 — `TASK-FAN-FE-015` 가 고친 상태가 정확히 그것이다).
#    이 파일은 그 사실을 **적을 뿐 강제하지 않는다** — 강제는 (x2) 의 미집행 문구다.
#
# -----------------------------------------------------------------------------
# 🔵 이 파일이 «한 곳» 이다
# -----------------------------------------------------------------------------
# 억제 선언은 여기 한 줄뿐이고, 체인 등록은 `infra/demo/projects.sh` 의 [fan] 행
# 하나다. 두 가드가 그 둘의 효력을 확인한다:
#   · (z27) — **렌더**로 (형제 (z19)의 팬 판. 대조군 + bite 포함)
#   · `check-suppressed-containers.sh` — **도는 컨테이너**로 (TASK-MONO-617).
#     🔵 그 판정자는 억제 대상을 **목록이 아니라 체인에서 유도**하므로
#     (`억제 = 렌더(체인 − infra/demo/*.override.yml) − 렌더(체인)`),
#     이 파일은 이름을 어디에도 안 적어도 **자동으로** 그 모집단에 들어간다.
#
# 🔴 이 파일을 지우면 데모가 다시 사본을 서빙한다 — 그리고 (z27)이 문다.
# =============================================================================

services:
  fan-platform-web:
    # 아무도 켜지 않는 프로파일. 이름이 곧 사유다. (형제와 같은 이름을 쓴다 —
    # 서로 다른 이름을 쓰면 "왜 다르지" 가 새 질문이 된다.)
    profiles:
      - vercel-migrated
