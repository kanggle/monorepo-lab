# =============================================================================
# infra/demo/ecommerce-vercel.override.yml — 데모에서 web-store 를 띄우지 않는다
# (TASK-MONO-604 / ADR-MONO-067 단계 2)
# =============================================================================
# 방문자 경로는 `https://store.hubwang.com`(Vercel)로 옮겨갔다. 그런데 데모 호스트는
# 여전히 자기 사본을 서빙했다 — 2026-08-29 실측으로 **둘 다 200** 이었다. 아무도 안 보는
# 컨테이너 하나가 32GB 인스턴스의 메모리를 쓰고 있었다(TASK-MONO-552 AC-0: 정상 상태
# 31.5 GiB 중 약 29 GiB 사용 · MemAvailable 2.4 GiB).
#
# -----------------------------------------------------------------------------
# 🔴 왜 base compose 에서 서비스를 «지우지» 않는가
# -----------------------------------------------------------------------------
# `projects/ecommerce-microservices-platform/docker-compose.yml` 은 데모 전용이 아니다.
# 지우면 데모만이 아니라 로컬 워크스루(`docs/guides/interview-demo-walkthrough.md` §2,
# `npm run ecommerce:up`)가 같이 죽는다. 그래서 억제는 **데모 체인에만** 얹는다.
#
# -----------------------------------------------------------------------------
# 🔵 기전: 오버라이드가 `profiles:` 를 «추가» 하면 그 서비스는 렌더에서 빠진다
# -----------------------------------------------------------------------------
# compose 는 서비스를 이름으로 병합하므로, base 에 없던 `profiles:` 를 여기서 붙이면
# 그 서비스는 프로파일이 켜졌을 때만 나타난다. 그 프로파일은 **아무도 켜지 않는다.**
# 2026-09-01 실측(데몬 없이 `docker compose config` 로만):
#
#   데모 체인(base + relay)            → 34 서비스, web-store 있음
#   데모 체인 + 이 파일                 → 33 서비스, web-store **없음**
#   로컬(base 단독)                    → web-store 있음   ← 대조군
#
# 🔴 다른 후보를 왜 안 골랐는지도 적어 둔다(다음 사람이 되돌리지 않도록):
#   · `deploy.replicas: 0` — 서비스가 **렌더에는 남는다**. 가드가 렌더를 보는 한
#     "억제됐다" 를 판정할 수 없고, 판정할 수 없는 억제는 조용히 되돌아간다.
#   · `demo-up.sh` 에 `--scale web-store=0` — `docker compose config` 로 **안 보인다**.
#     기전과 술어가 어긋나면 가드는 영원히 공허하다.
#   · base 에 `profiles:` — 로컬 기본 동작을 바꾼다. 워크스루가 그 자리를 방문 경로로
#     적고 있으므로 문서까지 같이 틀어진다.
#
# -----------------------------------------------------------------------------
# 🔵 이 파일이 «한 곳» 이다
# -----------------------------------------------------------------------------
# 억제 선언은 여기 한 줄뿐이고, 체인 등록은 `infra/demo/projects.sh` 의 [ecommerce] 행
# 하나다. 가드 (z19)가 그 둘의 효력을 **렌더로** 확인한다(대조군 + bite 포함).
#
# 🔴 이 파일을 지우면 데모가 다시 사본을 서빙한다 — 그리고 (z19)가 문다.
# =============================================================================

services:
  web-store:
    # 아무도 켜지 않는 프로파일. 이름이 곧 사유다.
    profiles:
      - vercel-migrated
