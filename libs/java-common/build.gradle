plugins {
    id 'io.spring.dependency-management'
}

dependencies {
    // Spring Web (for RestClient, JdkClientHttpRequestFactory, HttpClientErrorException in ResilienceClientFactory)
    implementation 'org.springframework:spring-web'

    // Resilience4j (CircuitBreaker + Retry — used by ResilienceClientFactory)
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-retry:2.2.0'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testImplementation 'org.assertj:assertj-core'
    // Reads platform/contracts/fixtures/performance-metrics-windows.json and checks that
    // PerformanceMetrics serialises to the contract shape (TASK-MONO-806) — test only.
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}
