plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'io.spring.dependency-management'
}

dependencies {
    // Testcontainers / spring-test must NOT leak into the production classpath
    // of consumers. They live in the `java-test-fixtures` source set so the
    // main `jar` of this module is empty (no Testcontainers classes) and
    // consuming services pick up the base class via
    //   testImplementation testFixtures(project(':libs:java-test-support'))
    testFixturesApi 'org.springframework:spring-test'
    testFixturesApi 'org.testcontainers:testcontainers'
    testFixturesApi 'org.testcontainers:mysql'
    testFixturesApi 'org.testcontainers:kafka'
    // DockerAvailableCondition implements JUnit 5 ExecutionCondition; expose the
    // API so consuming services pick up the extension transitively when they
    // wire AbstractIntegrationTest.
    testFixturesApi 'org.junit.jupiter:junit-jupiter-api'

    // TASK-MONO-546. This module had no `src/test` at all, so its two classes — the
    // base class every Testcontainers integration test in this repo extends, and the
    // ExecutionCondition wired onto it — had no tests of their own. The
    // `java-test-fixtures` plugin already puts the testFixtures output and its api
    // dependencies on the `test` source set's classpath, so only the engine and the
    // assertion library are added here. Versions come from the Spring Boot BOM, the
    // same convention every sibling libs module uses.
    //
    // These tests are Docker-free by construction and must stay that way: this
    // module's `test` runs in the `build-and-test` lane, which boots nothing.
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}
