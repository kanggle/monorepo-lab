# =============================================================================
# platform-console — Local Development Infrastructure
# =============================================================================
# Hostname-based routing (per ADR-MONO-001 Option C):
#   console-web is reached via http://console.local/ — Traefik routes on Host
#   header. No PORT_PREFIX, no host-port slot allocation.
#
# platform-console has NO backing services of its own (no DB / Redis / Kafka).
# It is Model B (ADR-MONO-013 D1): a single Next.js UI that calls GAP OIDC +
# the GAP product/tenant registry + per-domain gateway/admin APIs over the
# shared traefik-net network. Those domains run from their own compose files.
#
# Prerequisites:
#   1. Start the shared Traefik stack:  pnpm traefik:up
#   2. Add `127.0.0.1 console.local` to your hosts file (one-time)
#   3. The domains the console federates (gap/wms/scm) run from their own
#      compose files; the console only needs them reachable for live screens.
#
# Usage:
#   pnpm console:up     — start console-web
#   pnpm console:down   — stop
#   pnpm console:logs   — tail logs
# =============================================================================

services:
  console-web:
    image: platform-console/console-web:local
    container_name: platform-console-web
    build:
      context: ./apps/console-web
      # 🔴 TASK-MONO-585 — `@demo/backend-resolver` 는 이 컨텍스트 밖(저장소 루트
      #    `infra/demo/`)에 있다. 이름 붙인 추가 컨텍스트로 건네지 않으면 이미지 빌드가
      #    *"Module not found: Can't resolve '@demo/backend-resolver'"* 로 죽는다 —
      #    그런데 `pnpm install` 은 통과하므로(`link:` 는 대상이 없어도 심링크를 만든다)
      #    install 로그로는 안 보인다. 형제 둘(fan·web-store)이 `TASK-MONO-615` 에서
      #    AMI 굽기 10분 뒤에 이 지점으로 죽었고, 가드 (z26)이 이 축을 정적으로 문다.
      additional_contexts:
        demo-backend-resolver: ../../infra/demo/backend-resolver
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # Next.js standalone server
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: ${NODE_ENV:-production}
      # GAP OIDC PUBLIC client (Auth Code + PKCE, no client secret) —
      # registered by TASK-BE-296 (auth-service V0015 seed).
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://iam.local}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-platform-console-web}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://console.local/api/auth/callback}
      OIDC_SCOPE: ${OIDC_SCOPE:-openid profile email tenant.read}
      # Browser-visible console origin, resolved at RUNTIME (TASK-MONO-358).
      # `NEXT_PUBLIC_APP_URL` cannot serve this purpose — Next inlines every
      # `process.env.NEXT_PUBLIC_*` at BUILD time, so a prebuilt image is
      # permanently pinned to the host the build knew about. Unset → the code
      # falls back to `NEXT_PUBLIC_APP_URL`, so this default is a no-op.
      CONSOLE_PUBLIC_ORIGIN: ${CONSOLE_PUBLIC_ORIGIN:-http://console.local}
      # Cookie `Secure` flag. Defaults ON; only a declared plain-HTTP
      # deployment (the portfolio demo) sets it to the literal "false".
      # A browser REFUSES TO STORE a Secure cookie delivered over http:// on
      # any origin but localhost — with it on, the PKCE/state cookies are never
      # stored and every login bounces with `invalid_state`.
      CONSOLE_COOKIE_SECURE: ${CONSOLE_COOKIE_SECURE:-true}
      # GAP product/tenant registry — AUTHORITATIVE producer path
      # (TASK-BE-296 / console-registry-api.md): admin-service operator-auth
      # boundary GET /api/admin/console/registry (gateway public-path subtree
      # → admin-service OperatorAuthenticationFilter). Called server-side with
      # the EXCHANGED operator token (NOT the GAP OIDC token).
      CONSOLE_REGISTRY_URL: ${CONSOLE_REGISTRY_URL:-http://iam.local/api/admin/console/registry}
      REGISTRY_TIMEOUT_MS: ${REGISTRY_TIMEOUT_MS:-5000}
      # console-bff is reached on the DOCKER NETWORK, never through the Traefik
      # edge (TASK-MONO-362). Both containers sit on traefik-net, so Docker's
      # embedded DNS resolves the service name. The BFF holds no Traefik router:
      # being ON the network is not the same as being exposed BY it — exposure
      # comes from the router labels, and it has none.
      #
      # Same value the federation-hardening-e2e stack has always used; this
      # aligns the thin `pnpm console:up` stack with the one CI actually runs.
      CONSOLE_BFF_URL: ${CONSOLE_BFF_URL:-http://console-bff:8080}
      # GAP admin-service RFC 8693 operator-token exchange — AUTHORITATIVE
      # producer path (TASK-BE-298 / admin-api.md / ADR-MONO-014): POST
      # /api/admin/auth/token-exchange on the same /api/admin/** operator-auth
      # subtree. Console server-side exchanges the GAP OIDC access token
      # (subject_token) for a short-lived operator token (token_type=admin).
      # The GAP OIDC token is never an /api/admin/** credential.
      CONSOLE_TOKEN_EXCHANGE_URL: ${CONSOLE_TOKEN_EXCHANGE_URL:-http://iam.local/api/admin/auth/token-exchange}
      TOKEN_EXCHANGE_TIMEOUT_MS: ${TOKEN_EXCHANGE_TIMEOUT_MS:-5000}
      # -----------------------------------------------------------------------
      # Per-domain federation targets (TASK-MONO-505)
      # -----------------------------------------------------------------------
      # These must be NAMED here even though every one has a default in the
      # code: compose only injects variables it names, so a value set in
      # `infra/demo/demo.env` reaches the container only if this list mentions
      # the key. Before this block the console fell back to its own defaults,
      # every one of which is a hardcoded `.local` hostname — which resolves on
      # a developer laptop (hosts file + Traefik alias) and resolves NOWHERE on
      # the cloud demo, where the domain is `<ip>.sslip.io`. Containers healthy,
      # console up, five domain sections dead. Guard (u) enforces the pair.
      #
      # Each default below is BYTE-IDENTICAL to the code default, so the thin
      # `pnpm console:up` stack behaves exactly as before; the demo overrides
      # them via demo.env with the DEMO_DOMAIN form.
      #
      # Why hostnames rather than container DNS: in the integrated demo only
      # each project's `gateway-service` joins traefik-net — every backend
      # service stays on its own project network — so the console CANNOT reach
      # `wms-admin-service` and friends by container name the way the
      # single-compose federation-hardening-e2e harness does. Going through
      # `<domain>.<DEMO_DOMAIN>` reaches that project's gateway, which is also
      # what api-gateway-policy wants. It does NOT leave the host on AWS: the
      # Traefik container carries a network alias for each of these names
      # (guard (i)), so Docker's embedded DNS answers internally.
      IAM_ADMIN_API_BASE: ${IAM_ADMIN_API_BASE:-http://iam.local}
      CONSOLE_ONBOARDING_URL: ${CONSOLE_ONBOARDING_URL:-http://iam.local/api/admin/onboarding/organizations}
      WMS_ADMIN_BASE_URL: ${WMS_ADMIN_BASE_URL:-http://wms.local/api/v1/admin}
      WMS_OUTBOUND_BASE_URL: ${WMS_OUTBOUND_BASE_URL:-http://wms.local/api/v1/outbound}
      SCM_GATEWAY_BASE_URL: ${SCM_GATEWAY_BASE_URL:-http://scm.local}
      FINANCE_BASE_URL: ${FINANCE_BASE_URL:-http://finance.local}
      LEDGER_BASE_URL: ${LEDGER_BASE_URL:-http://finance.local}
      ERP_BASE_URL: ${ERP_BASE_URL:-http://erp.local}
      ECOMMERCE_ADMIN_BASE_URL: ${ECOMMERCE_ADMIN_BASE_URL:-http://ecommerce.local/api/admin}
      ECOMMERCE_PUBLIC_BASE_URL: ${ECOMMERCE_PUBLIC_BASE_URL:-http://ecommerce.local/api}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.platform-console.rule=Host(`console.${DEMO_DOMAIN:-local}`)"
      - "traefik.http.routers.platform-console.entrypoints=web"
      - "traefik.http.services.platform-console.loadbalancer.server.port=3000"
    networks:
      - traefik-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # console-bff — Spring Boot Hexagonal BFF (TASK-PC-BE-001).
  #
  # INTERNAL-ONLY, and now actually wired that way (TASK-MONO-362).
  #
  # It used to hold a Traefik router (`Host(console-bff.local)`) while the comment
  # right here said "internal-only — the browser never reaches this hostname".
  # Both cannot be true: a router on the shared edge means anyone who can send
  # `Host: console-bff.local` reaches the BFF. "Internal-only" was a comment, not a
  # constraint — and it made this the only BACKEND service in the monorepo holding
  # an edge router, which is precisely what api-gateway-policy.md L14 forbids
  # ("No backend service may be directly exposed to external traffic").
  #
  # The router is gone. console-web calls it on the docker network instead
  # (CONSOLE_BFF_URL=http://console-bff:8080) — the wiring the federation-hardening
  # e2e stack, the one CI actually runs, has always used.
  #
  # It STAYS on traefik-net: that is the network it shares with console-web, and
  # network membership is not exposure. Exposure comes from the router labels.
  # Traefik cannot route to a container it has no route for.
  #
  # expose: only — no host-port publish (Local Network Convention ADR-MONO-001).
  # Per-domain credential dispatch is request-scoped (stateless, no DB/Redis).
  # GAP issuer URL is passed via CONSOLE_BFF_IAM_ISSUER_URL (JWKS discovery).
  # ---------------------------------------------------------------------------
  console-bff:
    build:
      context: ./apps/console-bff
      dockerfile: Dockerfile
    container_name: platform-console-bff
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: "8080"
      # GAP OIDC issuer for RS256 JWKS validation of inbound bearer tokens.
      CONSOLE_BFF_IAM_ISSUER_URL: ${CONSOLE_BFF_IAM_ISSUER_URL:-http://iam.local}
      # JWKS is an actual FETCH, not a string compare, so it may point at
      # container DNS while the issuer above stays the public hostname. Unset,
      # application.yml derives it from the issuer — which works locally and
      # dies on AWS (an instance cannot reach its own public IP; no IGW
      # hairpin). demo.env pins it to the iam container.
      CONSOLE_BFF_JWK_SET_URI: ${CONSOLE_BFF_JWK_SET_URI:-http://iam.local/oauth2/jwks}
      # Outbound domain legs (TASK-MONO-505) — same reasoning as console-web's
      # block above: named here so demo.env can reach them, defaults identical
      # to application.yml so the thin stack is unchanged.
      CONSOLE_BFF_OUTBOUND_IAM_BASE_URL: ${CONSOLE_BFF_OUTBOUND_IAM_BASE_URL:-http://iam.local}
      CONSOLE_BFF_OUTBOUND_WMS_BASE_URL: ${CONSOLE_BFF_OUTBOUND_WMS_BASE_URL:-http://wms.local}
      CONSOLE_BFF_OUTBOUND_SCM_BASE_URL: ${CONSOLE_BFF_OUTBOUND_SCM_BASE_URL:-http://scm.local}
      CONSOLE_BFF_OUTBOUND_FINANCE_BASE_URL: ${CONSOLE_BFF_OUTBOUND_FINANCE_BASE_URL:-http://finance.local}
      CONSOLE_BFF_OUTBOUND_ERP_BASE_URL: ${CONSOLE_BFF_OUTBOUND_ERP_BASE_URL:-http://erp.local}
      # 🔴 The federation-hardening-e2e overlay does NOT set this one, because
      # ecommerce is not in that harness at all (its rendered service list has
      # no ecommerce service). So this leg had no prior art to promote — it is
      # authored here, and its absence is why the console's E-Commerce health
      # leg has read unavailable in the integrated demo.
      CONSOLE_BFF_OUTBOUND_ECOMMERCE_BASE_URL: ${CONSOLE_BFF_OUTBOUND_ECOMMERCE_BASE_URL:-http://ecommerce.local}
    # No Traefik labels — deliberately unroutable from the edge (TASK-MONO-362).
    # Do not re-add them: `scripts/check-gateway-drift.sh` (I2) will fail, which is
    # the point. A backend service reachable at the edge without a gateway has no
    # rate limiting, no identity-header strip→enrich, and no uniform error envelope.
    networks:
      - traefik-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  traefik-net:
    external: true
    name: traefik-net
