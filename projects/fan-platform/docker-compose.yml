# =============================================================================
# fan-platform — Local Development Infrastructure
# =============================================================================
# Hostname-based routing (per ADR-MONO-001 Option C):
#   gateway-service is reached via http://fan-platform.local/ — Traefik routes
#   based on Host header. No PORT_PREFIX, no host-port slot allocation.
#
# Prerequisites:
#   1. Start the shared Traefik stack:  pnpm traefik:up
#      (creates the external `traefik-net` network this compose file joins)
#   2. Add `127.0.0.1 fan-platform.local` to your hosts file (one-time setup)
#
# Services:
#   gateway-service   — Spring Cloud Gateway, OIDC token validation, tenant gate
#   community-service — REST + JPA + Kafka outbox; only reachable via gateway
#   postgres          — relational store (databases auto-provisioned via init script)
#   redis             — rate-limit counters, feed cache
#   kafka             — single-broker KRaft mode, outbox relay target
#
# Usage:
#   pnpm fan-platform:up    — start everything in this compose file
#   pnpm fan-platform:down  — stop containers (volumes preserved)
#   pnpm fan-platform:logs  — tail logs
# =============================================================================

services:
  gateway-service:
    image: fan-platform/gateway-service:local
    container_name: fan-platform-gateway
    build:
      context: ./apps/gateway-service
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://iam.local}
      JWT_JWKS_URI: ${JWT_JWKS_URI:-http://iam.local/oauth2/jwks}
      OIDC_REQUIRED_TENANT_ID: fan-platform
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      COMMUNITY_SERVICE_URI: http://community-service:8080
      ARTIST_SERVICE_URI: http://artist-service:8080
      MEMBERSHIP_SERVICE_URI: http://membership-service:8080
      NOTIFICATION_SERVICE_URI: http://notification-service:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://fan-platform.local,http://localhost:3000}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.fan-platform.rule=Host(`fan-platform.${DEMO_DOMAIN:-local}`)"
      - "traefik.http.routers.fan-platform.entrypoints=web"
      - "traefik.http.services.fan-platform.loadbalancer.server.port=8080"
    networks:
      - fan-platform-net
      - traefik-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # community-service — TASK-FAN-BE-002.
  # Only reachable internally via the gateway; no Traefik label.
  # ---------------------------------------------------------------------------
  community-service:
    image: fan-platform/community-service:local
    container_name: fan-platform-community
    build:
      context: ./apps/community-service
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://iam.local}
      JWT_JWKS_URI: ${JWT_JWKS_URI:-http://iam.local/oauth2/jwks}
      OIDC_REQUIRED_TENANT_ID: fan-platform
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB_COMMUNITY: ${POSTGRES_DB_COMMUNITY:-fanplatform_community}
      POSTGRES_USER: ${POSTGRES_USER:-fanplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fanplatform}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BOOTSTRAP: kafka:9092
      # TASK-FAN-BE-045 AC-6: follow-target validation calls artist-service.
      # Defaults in application.yml already resolve to this host; stated here so
      # the outbound edge is visible where the wiring is read.
      ARTIST_SERVICE_BASE_URL: http://artist-service:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # Not ordering pedantry: the check is fail-closed, so community coming up
      # first would refuse every follow until artist-service is healthy — which
      # in the demo means the seed's own follow calls fail (TASK-FAN-BE-045).
      artist-service:
        condition: service_healthy
    networks:
      - fan-platform-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ---------------------------------------------------------------------------
  # artist-service — TASK-FAN-BE-003.
  # Master-data REST service (Hexagonal architecture). Only reachable internally
  # via the gateway; no Traefik label.
  # ---------------------------------------------------------------------------
  artist-service:
    image: fan-platform/artist-service:local
    container_name: fan-platform-artist
    build:
      context: ./apps/artist-service
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://iam.local}
      JWT_JWKS_URI: ${JWT_JWKS_URI:-http://iam.local/oauth2/jwks}
      OIDC_REQUIRED_TENANT_ID: fan-platform
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB_ARTIST: ${POSTGRES_DB_ARTIST:-fanplatform_artist}
      POSTGRES_USER: ${POSTGRES_USER:-fanplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fanplatform}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - fan-platform-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ---------------------------------------------------------------------------
  # membership-service — TASK-FAN-BE-009.
  # Subscription state machine + PG mock + internal access-check + outbox.
  # The /api/fan/** surface is reachable via the gateway; the /internal/**
  # access-check surface is reachable only on fan-platform-net by community-service
  # (workload-identity, ADR-MONO-005) and is NOT gateway-routed. No Traefik label.
  # ---------------------------------------------------------------------------
  membership-service:
    image: fan-platform/membership-service:local
    container_name: fan-platform-membership
    build:
      context: ./apps/membership-service
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://iam.local}
      JWT_JWKS_URI: ${JWT_JWKS_URI:-http://iam.local/oauth2/jwks}
      OIDC_REQUIRED_TENANT_ID: fan-platform
      # Workload-identity (ADR-MONO-005) — /internal/** validates an IAM
      # client_credentials JWT against this JWKS + issuer.
      INTERNAL_JWT_JWK_SET_URI: ${INTERNAL_JWT_JWK_SET_URI:-http://iam.local/oauth2/jwks}
      INTERNAL_JWT_ISSUER: ${INTERNAL_JWT_ISSUER:-http://iam.local}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB_MEMBERSHIP: ${POSTGRES_DB_MEMBERSHIP:-fanplatform_membership}
      POSTGRES_USER: ${POSTGRES_USER:-fanplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fanplatform}
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - fan-platform-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ---------------------------------------------------------------------------
  # notification-service — TASK-FAN-BE-013.
  # event-consumer (membership lifecycle events) + thin rest-api inbox. Consumes
  # fan.membership.{activated,canceled}.v1, records a per-fan notification
  # idempotently, fans out via mock channels, serves a recipient-scoped inbox.
  # The /api/fan/notifications surface is reachable via the gateway; the consume
  # path is Kafka-only. Terminal consumer (no outbox). No Traefik label.
  # ---------------------------------------------------------------------------
  notification-service:
    image: fan-platform/notification-service:local
    container_name: fan-platform-notification
    build:
      context: ./apps/notification-service
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://iam.local}
      JWT_JWKS_URI: ${JWT_JWKS_URI:-http://iam.local/oauth2/jwks}
      OIDC_REQUIRED_TENANT_ID: fan-platform
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB_NOTIFICATION: ${POSTGRES_DB_NOTIFICATION:-fanplatform_notification}
      POSTGRES_USER: ${POSTGRES_USER:-fanplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fanplatform}
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - fan-platform-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ---------------------------------------------------------------------------
  # fan-platform-web — 팬 고객 화면 (TASK-FAN-FE-014)
  # ---------------------------------------------------------------------------
  # 이 서비스가 없던 동안 통합 데모에는 팬 고객이 보는 화면이 아예 없었다.
  # `fan-platform.${DEMO_DOMAIN}` 은 게이트웨이(API)로 뜨고, 웹은 어디에서도
  # 서빙되지 않았다 — ecommerce 의 web-store 는 이미 되어 있는데(형제 파리티 결손).
  #
  # 호스트명을 `web.` 접두로 분리하는 이유
  # ---------------------------------------------------------------------------
  # 게이트웨이가 이미 `Host(fan-platform.${DEMO_DOMAIN})` 를 통째로 쓴다. 같은 호스트에
  # 웹을 얹으면 두 라우터가 경로 우선순위로 갈리게 되는데, 이 앱은 `/api/auth/*` 를
  # 자기 라우트로 쓰고 게이트웨이도 `/api/**` 를 쓴다 — 경계가 서로 얽힌다.
  # `web.ecommerce.${DEMO_DOMAIN}` 과 같은 형태로 분리하는 것이 형제 선례이고,
  # Traefik 규칙이 하나뿐이라 진단도 단순하다.
  #
  # ⚠ 이 호스트명은 IAM 에 **등록돼 있어야** 한다(TASK-BE-573, V0031). 데모의 런타임
  # 시드(`infra/demo/seed-demo-domain.sh`)는 *이미 등록된* URI 의 `.local/` 을 치환할
  # 뿐 `web.` 서브도메인을 만들어내지 못한다. 미등록이면 로그인 콜백이 401
  # `"Missing or invalid internal credentials"` 로 죽는데 그 메시지는 원인을 전혀
  # 가리키지 않는다.
  #
  # 빌드타임에 호스트명을 굽지 않는다
  # ---------------------------------------------------------------------------
  # `NEXT_PUBLIC_*` 는 빌드타임 인라인이고 데모 AMI 는 DEMO_DOMAIN 이 정해지기 전에
  # 구워진다. 이 앱은 브라우저에서 게이트웨이를 호출하지 않으므로(server-only
  # `shared/api/client.ts`) 공개 URL 을 구울 필요 자체가 없다 — 아래 값은 전부 런타임 env 다.
  fan-platform-web:
    image: fan-platform/fan-platform-web:local
    container_name: fan-platform-web
    build:
      # 빌드 컨텍스트는 pnpm 워크스페이스 루트(= 이 compose 파일이 있는 디렉터리).
      # web/fan-platform-web 을 컨텍스트로 잡으면 lockfile 이 밖에 남아
      # `--frozen-lockfile` 이 실패한다.
      context: .
      dockerfile: web/fan-platform-web/Dockerfile
    init: true
    restart: unless-stopped
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          # web-store 와 같은 상한. 실측(로그인 + 5화면 SSR 직후) RSS = 45 MiB 라
          # 5배 이상 여유가 있다. 데모 호스트(m6i.2xlarge)의 잔여가 타이트하므로
          # 상한 없이 두지 않는다. ⚠ 단일 표본이고 시드 데이터가 없는 상태의 값이다.
          memory: 256M
          cpus: '0.5'
    environment:
      # 자기 자신의 공개 오리진. next-auth 가 콜백 URL 을 여기서 만든다.
      NEXTAUTH_URL: http://web.fan-platform.${DEMO_DOMAIN:-local}
      # 세션 쿠키 서명 키. 데모 전용 값이며 프로덕션은 반드시 교체한다.
      NEXTAUTH_SECRET: ${FAN_WEB_NEXTAUTH_SECRET:-fan-platform-demo-session-signing-key}
      # issuer 는 **문자열 비교이자 브라우저가 실제로 가는 주소**다 → 공개 호스트명.
      # 컨테이너 안에서도 해소되는 이유는 Traefik 컨테이너의 network alias 다
      # (infra/traefik/docker-compose.yml — 가드 (i) 가 이 정합을 지킨다).
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://iam.local}
      OIDC_CLIENT_ID: ${FAN_OIDC_CLIENT_ID:-fan-platform-user-flow-client}
      # dev 전용 자격증명(V0011 이 BCrypt 해시로 시드, .env.example 에 평문 공개).
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-fan-platform-dev}
      # SSR fetch 는 Traefik 을 타지 않고 컨테이너 DNS 로 직행한다. AWS 는 인스턴스가
      # 자기 공인 IP 로 보낸 트래픽을 되돌려주지 않으므로(IGW hairpin 부재) 공개
      # 호스트명을 쓰면 클라우드에서만 죽는다.
      GATEWAY_URL_INTERNAL: http://gateway-service:8080
      # 데모 결제 스위치(TASK-FAN-FE-015). `1` 이면 체크아웃과 자동갱신 등록이 PortOne
      # 결제창을 건너뛰고 백엔드의 목 게이트웨이로 그대로 간다. **여기서 이름을 적어야
      # 컨테이너에 들어간다** — demo.env 에만 값을 두면 도달하지 않는다(MONO-505 교훈).
      # 이 값은 `NEXT_PUBLIC_*` 이 아니다: 그건 빌드타임에 인라인되므로 한 번 구운
      # 이미지의 답이 영원히 고정된다. `/api/payment-config` 가 런타임에 읽는다.
      DEMO_PAYMENT_MOCK: ${DEMO_PAYMENT_MOCK:-}
    depends_on:
      gateway-service:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.fan-platform-web.rule=Host(`web.fan-platform.${DEMO_DOMAIN:-local}`)"
      - "traefik.http.routers.fan-platform-web.entrypoints=web"
      - "traefik.http.services.fan-platform-web.loadbalancer.server.port=3000"
    healthcheck:
      # `/login` 을 찌른다: 미들웨어가 공개 경로로 통과시키는 유일한 페이지이고
      # 게이트웨이 fetch 가 전혀 없어 백엔드 상태와 무관하게 "Next 가 서빙 중인가"만 잰다.
      # `/` 는 미들웨어가 /login 으로 307 을 준다.
      #
      # 🔴 `localhost` 가 아니라 `127.0.0.1` 이어야 한다(가드 (j)). Dockerfile 의
      # HOSTNAME=0.0.0.0 이 Node 를 IPv4 전용으로 묶는데 alpine 의 /etc/hosts 는
      # localhost 를 ::1 로도 매핑하고 busybox wget 은 ::1 을 고른 뒤 IPv4 로
      # 폴백하지 않는다 → 앱은 멀쩡한데 프로브만 죽고, **Traefik 은 non-healthy
      # 컨테이너를 조용히 건너뛴다**(에러 0건). 오타 하나가 화면 전체를 지운다.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fan-platform-net
      - traefik-net

  # ---------------------------------------------------------------------------
  # Postgres 16 — backing store for community / artist / membership / notification.
  # Multi-database: docker-entrypoint-initdb.d script creates per-service DBs
  # so each service has its own isolated schema namespace.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: fan-platform-postgres
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fanplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fanplatform}
      POSTGRES_DB: ${POSTGRES_DB:-fanplatform}
      POSTGRES_DB_COMMUNITY: ${POSTGRES_DB_COMMUNITY:-fanplatform_community}
      POSTGRES_DB_ARTIST: ${POSTGRES_DB_ARTIST:-fanplatform_artist}
      POSTGRES_DB_MEMBERSHIP: ${POSTGRES_DB_MEMBERSHIP:-fanplatform_membership}
      POSTGRES_DB_NOTIFICATION: ${POSTGRES_DB_NOTIFICATION:-fanplatform_notification}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fanplatform}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - fan-platform-net

  # ---------------------------------------------------------------------------
  # Redis 7 — rate-limit counters (gateway) + feed cache (community).
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: fan-platform-redis
    restart: unless-stopped
    expose:
      - "6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fan-platform-net

  # ---------------------------------------------------------------------------
  # Kafka 3.7 — single-broker KRaft mode. Outbox relay target.
  # bitnami/kafka image because the same image is used in the wms-platform and
  # ecommerce-microservices-platform compose files (consistency wins).
  # ---------------------------------------------------------------------------
  # KRaft mode (no Zookeeper).
  #
  # apache/kafka, NOT bitnami/kafka: `bitnami/kafka:3.7` was deleted from Docker Hub
  # (tag 404; the repository's tag list is now empty), so `docker compose up` died with
  # `failed to resolve reference`. iam/wms/ecommerce were already on apache/kafka —
  # scm/erp/fan were the stragglers. See TASK-MONO-353.
  #
  # The two images are not drop-in compatible:
  #   - env prefix:  bitnami `KAFKA_CFG_*` (+ ALLOW_PLAINTEXT_LISTENER) → apache raw `KAFKA_*`
  #   - CLUSTER_ID:  bitnami auto-generates one; apache requires it explicitly
  #   - data dir:    /bitnami/kafka → /var/lib/kafka/data
  #   - CLI path:    on PATH → /opt/kafka/bin (healthcheck must use the absolute path)
  #
  # The replication-factor overrides below are load-bearing on a single broker: bitnami
  # defaulted them to 1, apache defaults to 3. Without them the broker still reports
  # healthy but every consumer group silently fails to initialise its offsets topic.
  kafka:
    image: apache/kafka:3.7.0
    container_name: fan-platform-kafka
    restart: unless-stopped
    expose:
      - "9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qg}
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    networks:
      - fan-platform-net

volumes:
  postgres-data:
  redis-data:
  kafka-data:

networks:
  fan-platform-net:
    driver: bridge
  traefik-net:
    external: true
    name: traefik-net
