spring:
  application:
    name: fan-platform-gateway-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  # Standard OAuth2 Resource Server backed by GAP's JWKS.
  security:
    oauth2:
      resourceserver:
        jwt:
          # OIDC issuer for SAS-issued tokens (GAP auth-service).
          issuer-uri: ${OIDC_ISSUER_URL:http://iam.local}
          # JWKS endpoint default. Real environments set OIDC_JWK_SET_URI to the
          # issuer's JWKS endpoint. JWT_JWKS_URI is the legacy env var name.
          jwk-set-uri: ${OIDC_JWK_SET_URI:${JWT_JWKS_URI:${OIDC_ISSUER_URL:http://iam.local}/oauth2/jwks}}

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://fan-platform.local,http://localhost:3000}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-Request-Id
              - Idempotency-Key
            exposedHeaders:
              - X-Request-Id
              - ETag
              - Retry-After
            maxAge: 3600
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s
      routes:
        # community-service — external path /api/v1/community/** is rewritten to
        # the downstream service's /api/community/** (TASK-FAN-BE-005 production fix).
        - id: community-service
          uri: ${COMMUNITY_SERVICE_URI:http://community-service:8080}
          predicates:
            - Path=/api/v1/community/**
          filters:
            # Strip the v1 namespace prefix before forwarding to community-service.
            # The optional-segment regex (?:/.*)? captures both the collection
            # form (no trailing slash, no further segments) and the
            # path-variable form so a POST /api/v1/community/posts (no trailing
            # slash) is rewritten to /api/community/posts and not left as the
            # external path. (TASK-MONO-044f RC#1b)
            # /api/v1/community              → /api/community
            # /api/v1/community/posts        → /api/community/posts
            # /api/v1/community/posts/{id}/reactions → /api/community/posts/{id}/reactions
            - RewritePath=/api/v1/community(?<segment>(?:/.*)?), /api/community${segment}
            # Global ceiling per IP — 60 req/min, bursts up to 120.
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 120
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@accountKeyResolver}"

        # artist-service routes — 3 explicit routes (one per downstream base path)
        # rather than a single ambiguous /api/v1/artist/** catch-all.
        # This avoids complex regex and keeps the gateway path → service path mapping 1:1.
        # (TASK-FAN-BE-005 production fix — option B: explicit separation)

        - id: artist-service-artists
          uri: ${ARTIST_SERVICE_URI:http://artist-service:8080}
          predicates:
            - Path=/api/v1/artists/**
          filters:
            # See community-service route for the (?:/.*)? rationale.
            # /api/v1/artists           → /api/artists           (collection POST/GET)
            # /api/v1/artists/{id}/...  → /api/artists/{id}/...
            - RewritePath=/api/v1/artists(?<segment>(?:/.*)?), /api/artists${segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 120
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@accountKeyResolver}"

        - id: artist-service-artist-groups
          uri: ${ARTIST_SERVICE_URI:http://artist-service:8080}
          predicates:
            - Path=/api/v1/artist-groups/**
          filters:
            # See community-service route for the (?:/.*)? rationale.
            - RewritePath=/api/v1/artist-groups(?<segment>(?:/.*)?), /api/artist-groups${segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 120
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@accountKeyResolver}"

        - id: artist-service-fandoms
          uri: ${ARTIST_SERVICE_URI:http://artist-service:8080}
          predicates:
            - Path=/api/v1/fandoms/**
          filters:
            # See community-service route for the (?:/.*)? rationale.
            - RewritePath=/api/v1/fandoms(?<segment>(?:/.*)?), /api/fandoms${segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 120
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@accountKeyResolver}"

        # TASK-MONO-748 (ADR-MONO-079 D1) — agencies live in artist-service.
        - id: artist-service-agencies
          uri: ${ARTIST_SERVICE_URI:http://artist-service:8080}
          predicates:
            - Path=/api/v1/agencies/**
          filters:
            # See community-service route for the (?:/.*)? rationale.
            - RewritePath=/api/v1/agencies(?<segment>(?:/.*)?), /api/agencies${segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 120
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@accountKeyResolver}"

        # membership-service — external path /api/v1/memberships/** is rewritten
        # to the downstream service's /api/fan/memberships/** (TASK-FAN-BE-009).
        # The /internal/membership/access surface is NOT routed here — it is
        # reachable only on fan-platform-net by community-service using
        # workload identity (ADR-MONO-005).
        - id: membership-service
          uri: ${MEMBERSHIP_SERVICE_URI:http://membership-service:8080}
          predicates:
            - Path=/api/v1/memberships/**
          filters:
            # See community-service route for the (?:/.*)? rationale.
            # /api/v1/memberships              → /api/fan/memberships
            # /api/v1/memberships/{id}/cancel  → /api/fan/memberships/{id}/cancel
            - RewritePath=/api/v1/memberships(?<segment>(?:/.*)?), /api/fan/memberships${segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 120
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@accountKeyResolver}"

        # notification-service — external path /api/v1/notifications/** is
        # rewritten to the downstream service's /api/fan/notifications/**
        # (TASK-FAN-BE-013). The consume path (Kafka inbound) has no gateway
        # surface; only the in-app inbox read API is routed here.
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://notification-service:8080}
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            # See community-service route for the (?:/.*)? rationale.
            # /api/v1/notifications              → /api/fan/notifications
            # /api/v1/notifications/{id}/read    → /api/fan/notifications/{id}/read
            - RewritePath=/api/v1/notifications(?<segment>(?:/.*)?), /api/fan/notifications${segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 120
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@accountKeyResolver}"

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: INFO
    com.example.fanplatform.gateway: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.web: INFO
  pattern:
    level: "%5p [traceId=%X{traceId:-} requestId=%X{requestId:-}]"

fanplatform:
  # OIDC Resource Server validators.
  oauth2:
    # TASK-MONO-367 (2026-08-01 sunset, LANDED): the legacy custom-JWT issuer `iam` is no
    # longer minted (TASK-BE-398) and no longer accepted here. SAS issuer only.
    allowed-issuers: ${OIDC_ALLOWED_ISSUERS:${OIDC_ISSUER_URL:http://iam.local}}
    required-tenant-id: ${OIDC_REQUIRED_TENANT_ID:fan-platform}
    # TASK-MONO-696 — audience allowlist (platform/contracts/jwt-standard-claims.md § JWT
    # Validation rule 5). `aud` is the CLIENT ID the token was issued to, not a platform name;
    # a token is admitted iff its aud values intersect this list. Mandatory: absent or empty
    # fails the boot. Values = the clients MEASURED to reach this edge (TASK-MONO-696 § AC-1 (b):
    # the fan web app's user-flow client).
    # TASK-MONO-751 added `platform-console-web`: the console now DOES reach this edge — the
    # platform operator's fan-directory screens call `/api/v1/{agencies,artists,artist-groups}`
    # with the assume-tenant token (tenant `fan-platform`), and that token's `aud` is the console
    # client (auth-service AssumeTenantExchangeIntegrationTest AC-6 pins
    # `aud ∋ platform-console-web`). Same value the ecommerce/wms/scm/erp/finance gateways list.
    # Added while still SHADOW so the ENFORCE flip (TASK-MONO-697) does not cut the console off.
    # Clients whose reach could not be measured are deliberately NOT listed — under ENFORCE their tokens are refused with 403
    # (TASK-MONO-697 found no configured caller for any of them); adding one is a
    # reviewed allowlist change.
    allowed-audiences: ${OIDC_ALLOWED_AUDIENCES:fan-platform-user-flow-client,platform-console-web}
    # ENFORCE = 403 AUDIENCE_FORBIDDEN on a mismatch (rollout phase 2, TASK-MONO-697 — flipped
    # once the measured mismatch count was zero, all six gateways in one change). SHADOW = log +
    # count, never reject; it stays as the rollback: the project compose passes OIDC_AUDIENCE_MODE
    # through, so setting it to SHADOW and recreating the gateway reverts without a rebuild.
    # AudienceShippedConfigTest fails if this ships as anything but ENFORCE.
    audience-mode: ${OIDC_AUDIENCE_MODE:ENFORCE}

# JWKS startup probe — fails the gateway boot fast when GAP/IdP is unreachable
# at startup, instead of waiting for the first protected request. Configured per
# TASK-FAN-BE-001 § Edge Cases ("OIDC discovery 실패 (GAP 다운) ... 30초 후에도
# 실패하면 fail-fast"). Disable in tests via gateway.jwks.startup-probe.enabled.
gateway:
  jwks:
    startup-probe:
      enabled: ${GATEWAY_JWKS_STARTUP_PROBE_ENABLED:true}
      timeout-seconds: ${GATEWAY_JWKS_STARTUP_PROBE_TIMEOUT_SECONDS:30}
