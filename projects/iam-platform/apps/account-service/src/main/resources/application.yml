spring:
  application:
    name: account-service
  config:
    import: optional:classpath:application-defaults.yml

  datasource:
    url: jdbc:mysql://localhost:3306/account_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:account_user}
    password: ${DB_PASSWORD:account_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    properties:
      hibernate:
        jdbc:
          # TASK-BE-257: bulk provisioning — Hibernate JDBC batch size for IO optimization.
          # Keeps per-row transactions short while grouping INSERT statements into batches of 50.
          batch_size: 50
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 50ms

  # TASK-MONO-770 — SMTP for the verification mail. Only the timeouts live here; the connection itself
  # (spring.mail.host / port / username / password) comes from the environment (SPRING_MAIL_HOST …).
  # 🔴 Do NOT add a `spring.mail.host` default: Spring Boot creates a JavaMailSender as soon as the key
  # exists (even blank), so a default here would make an enabled-but-unconfigured deployment start and
  # then fail every send — instead of failing at boot (SmtpEmailVerificationNotifier needs the sender).
  # The timeouts bound the synchronous resend request: an unreachable mail server answers 503
  # VERIFICATION_EMAIL_SEND_FAILED in seconds instead of hanging the request thread.
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    consumer:
      # TASK-BE-103: account-service consumes auth.login.succeeded to update
      # accounts.last_login_succeeded_at. The group ID is independent from
      # security-service's "security-service" group so both services receive
      # every event.
      group-id: account-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        "[enable.idempotence]": true
        "[max.in.flight.requests.per.connection]": 1

server:
  port: 8082

# TASK-MONO-770 — a mail-server outage must not mark account-service DOWN (Traefik and compose drop an
# unhealthy container; the mail path has its own error answer, 503 VERIFICATION_EMAIL_SEND_FAILED).
management:
  health:
    mail:
      enabled: false

account:
  # TASK-BE-451 — v2 outbox relay (AccountOutboxPublisher) cadence + batch size.
  outbox:
    poll-ms: ${ACCOUNT_OUTBOX_POLL_MS:1000}
    initial-delay-ms: ${ACCOUNT_OUTBOX_INITIAL_DELAY_MS:5000}
    batch-size: ${ACCOUNT_OUTBOX_BATCH_SIZE:100}
  deletion:
    grace-period-days: ${DELETION_GRACE_PERIOD_DAYS:30}
  auth-service:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    connect-timeout-ms: 3000
    # TASK-BE-247: raised from 5000 to 15000 to mask auth-service cold-start / GC pauses.
    # This reduces the race window where auth-service commits after account-service times out
    # and rolls back (half-commit producing an orphan credential). 15s is the agreed UX ceiling;
    # beyond that, async signup redesign would be required.
    read-timeout-ms: 15000

outbox:
  polling:
    interval-ms: ${OUTBOX_POLLING_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_POLLING_BATCH_SIZE:50}
  topic-mapping:
    account.created: account.created
    account.status.changed: account.status.changed
    account.locked: account.locked
    account.unlocked: account.unlocked
    account.deleted: account.deleted

internal:
  api:
    # TASK-BE-319b (ADR-005 단계 4b): /internal/** authenticates with a GAP-issued
    # client_credentials JWT (Authorization: Bearer) ONLY — the legacy static X-Internal-Token
    # (internal.api.token) was removed now that every caller (security/admin/auth/community/
    # membership) is on Bearer. When bypass-when-unconfigured=false (default) and no valid JWT is
    # presented, /internal/** is rejected with 401 (fail-closed). The bypass flag is for @WebMvcTest
    # slice tests, local development and the 'test'/'standalone' profiles only — never in production.
    bypass-when-unconfigured: ${INTERNAL_API_BYPASS_WHEN_UNCONFIGURED:false}
    # The decoder validates signature (JWKS) + issuer only — account-service is multi-tenant, so no
    # tenant_id pinning here. JWKS is fetched lazily (no OIDC discovery at startup), so bootup is not
    # coupled to auth-service availability.
    jwt:
      jwk-set-uri: ${OIDC_JWK_SET_URI:${OIDC_ISSUER_URL:http://localhost:8081}/oauth2/jwks}
      issuer: ${OIDC_ISSUER_URL:http://localhost:8081}

# TASK-BE-487 (ADR-005 단계 4): outbound /internal/auth/** calls (credential create / identity
# backfill → auth-service) authenticate with a GAP client_credentials Bearer JWT (was unauthenticated).
# The token is minted at auth-service's /oauth2/token with client_id=account-service-client (seeded in
# auth V0019) and cached by the canonical libs/java-security IamClientCredentialsTokenProvider
# (TASK-BE-568, ADR-MONO-058 § D6) — lazy (first outbound auth call) so startup never depends on
# auth-service being ready. Receiver (auth /internal/auth/**) now requires it. connect/read-timeout-ms
# are the token-FETCH call's own timeouts — a distinct knob from account.auth-service.* above (the
# downstream credential-write call's timeouts): the shared provider previously had no timeout at all
# (RestClient.create()), letting a hung token endpoint block the caller's thread indefinitely.
iam:
  # TASK-BE-614 (ADR-MONO-078 A): consumer-site signups are born into the shared account pool
  # (tenant `consumer-pool` + a consumer_site_memberships row) and site-scoped account lookups
  # include that site's pool members — ONLY while this is true. Default true since TASK-BE-616
  # (pool login = TASK-BE-615, first-visit consent = TASK-BE-616 — both shipped; turned on in the
  # same change that renames the store login page to «IAM», ADR-007 § 값 변경 2026-10-01).
  # IAM_CONSUMER_POOL_ENABLED=false stays a kill switch: byte-identical pre-pool signup/lookups.
  consumer-pool:
    enabled: ${IAM_CONSUMER_POOL_ENABLED:true}
  # TASK-MONO-770 (ADR-MONO-080 D3) — which EmailVerificationNotifier is wired (account-api.md § Delivery):
  #   enabled=true            → SmtpEmailVerificationNotifier (standard spring.mail.* — any SMTP endpoint)
  #   enabled=false, not prod → LoggingEmailVerificationNotifier (masked recipient, token never logged)
  #   enabled=false, prod     → none → the context fails to start (TASK-BE-236 fail-fast kept)
  # A property, not a profile: the demo runs IAM under `e2e`, where a @Profile("prod") adapter never runs.
  mail:
    enabled: ${IAM_MAIL_ENABLED:false}
    from: ${IAM_MAIL_FROM:no-reply@iam.local}
    # The IdP page the mail links to (auth-service GET /verify-email); `?token=…` is appended.
    verification-link-base-url: ${IAM_MAIL_VERIFICATION_LINK_BASE_URL:http://localhost:8081/verify-email}
  internal-client:
    token-uri: ${OIDC_TOKEN_URI:${OIDC_ISSUER_URL:http://localhost:8081}/oauth2/token}
    client-id: ${ACCOUNT_SERVICE_CLIENT_ID:account-service-client}
    client-secret: ${ACCOUNT_SERVICE_CLIENT_SECRET:secret}
    connect-timeout-ms: ${IAM_INTERNAL_CLIENT_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${IAM_INTERNAL_CLIENT_READ_TIMEOUT_MS:5000}
