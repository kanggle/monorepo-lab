server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        # OIDC / OAuth2 standard endpoints (TASK-BE-251 Phase 2c).
        # Ordered BEFORE auth-service to ensure /oauth2/** and /.well-known/openid-configuration
        # are forwarded to auth-service WITHOUT gateway JWT verification.
        # The SAS filter chain inside auth-service handles all authentication for these paths.
        - id: auth-service-oidc
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/oauth2/**,/.well-known/openid-configuration
          filters:
            - StripPrefix=0

        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        # TASK-BE-508: user session-management endpoints are implemented by
        # auth-service (AccountSessionController), NOT account-service, yet they
        # share the /api/accounts/me/sessions prefix. This more-specific route MUST
        # be declared BEFORE the account-service /api/accounts/** route — Spring
        # Cloud Gateway matches routes in DECLARATION ORDER, so the broader account
        # route would otherwise swallow session calls (misroute → account-service
        # NoResourceFoundException → 500). Authenticated: NOT in public-paths, so the
        # JWT filter runs and injects X-Account-ID / X-Device-Id downstream.
        - id: auth-service-sessions
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/accounts/me/sessions,/api/accounts/me/sessions/**
          filters:
            - StripPrefix=0

        - id: account-service
          uri: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/accounts/**
          filters:
            - StripPrefix=0

        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/admin/**,/.well-known/admin/**
          filters:
            - StripPrefix=0

        - id: account-service-internal
          uri: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/internal/tenants/**
          filters:
            - StripPrefix=0

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 100ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  metrics:
    tags:
      service: ${spring.application.name}

gateway:
  jwt:
    jwks-url: ${JWKS_URL:http://localhost:8081/internal/auth/jwks}
    jwks-refresh-interval-ms: 600000
    jwks-cache-ttl-seconds: 600
    grace-period-seconds: 300
    # TASK-BE-143: enforce the iss claim.
    #
    # TASK-MONO-365: an ALLOWLIST, not a single value — and this edge was the only
    # gateway of seven that pinned one. IAM mints two issuers during the D2-b window:
    # the SAS/OIDC issuer (auth-service application.yml L177) and the legacy `iam`
    # string (L114). The other six gateways accept both. This one accepted the LEGACY
    # value only, and JWT_EXPECTED_ISSUER was overridden in no compose file anywhere —
    # so SAS-issued tokens, which the rest of the fleet takes as primary, were 401'd
    # here. Nothing failed, because console-bff reaches the IAM services directly and
    # never crosses this edge (TASK-MONO-347).
    #
    # TASK-BE-398 (2026-08-01 sunset, LANDED) removed the legacy custom-JWT flow that
    # minted `iss=iam`; the trailing legacy-issuer entry is dropped here with it, so the
    # edge no longer accepts a retired issuer. `TokenValidatorUnitTest
    # #theEdgeSurvivesTheLegacyIssuerSunset` asserts exactly this world: SAS tokens
    # pass, legacy `iss=iam` tokens do not.
    allowed-issuers: ${JWT_ALLOWED_ISSUERS:${OIDC_ISSUER_URL:http://localhost:8081}}

  tenant:
    legacy-fallback:
      enabled: ${GATEWAY_TENANT_LEGACY_FALLBACK_ENABLED:false}
      default-tenant-id: fan-platform

  rate-limit:
    fail-open: ${RATE_LIMIT_FAIL_OPEN:true}
    login:
      max-requests: 20
      window-seconds: 60
    signup:
      max-requests: 5
      window-seconds: 60
    refresh:
      max-requests: 10
      window-seconds: 60
    global:
      max-requests: 100
      window-seconds: 1

  public-paths:
    # TASK-BE-398: POST /api/auth/login + GET/POST /api/auth/oauth/** were removed from
    # this allowlist together with the auth-service endpoints they fronted (ADR-001 D2-b
    # sunset, 2026-08-01). Login is now standard OIDC via /oauth2/** below.
    - POST:/api/accounts/signup
    - POST:/api/auth/refresh
    - GET:/actuator/health
    # OIDC / OAuth2 standard endpoints (TASK-BE-251 Phase 2c).
    # Gateway passes these through without JWT verification — auth-service (SAS)
    # handles all authentication for these endpoints internally.
    # Covers: /oauth2/authorize, /oauth2/token, /oauth2/jwks, /oauth2/userinfo,
    #         /oauth2/revoke, /oauth2/introspect, /.well-known/openid-configuration
    - GET:/oauth2/**
    - POST:/oauth2/**
    - GET:/.well-known/openid-configuration
    # === admin subtree — delegated wholesale, NOT enumerated (TASK-MONO-508) ===
    #
    # gateway-api.md § Admin Routes declares this a PLATFORM INVARIANT:
    #
    #   "gateway 는 /api/admin/** 및 /.well-known/admin/** 서브트리 전체에서 자체 JWT
    #    검증을 수행하지 않는다. … 이 위임 관계는 플랫폼 불변식이다. 향후 operator JWT 를
    #    gateway 에서 검증하도록 변경하려면 ADR + 본 섹션 개정이 선행되어야 한다."
    #
    # operator tokens are minted by admin-service under its OWN RS256 key pair
    # (kid=v1, iss=admin-service) and cannot be verified against auth-service's
    # account JWKS. admin-service's OperatorAuthenticationFilter is the single
    # verification point, and it already covers the whole subtree — its
    # shouldNotFilter() ends in `return !path.startsWith("/api/admin/")`, with an
    # explicit skip list for the endpoints that legitimately carry no operator JWT
    # (login, token-exchange, 2FA bootstrap, refresh, onboarding, jwks).
    #
    # This USED TO BE a hand-maintained per-path enumeration, and it had fallen
    # behind: every operator endpoint added after the list was written was dark.
    # Measured on the integrated demo with a real operator token — 3/3 enumerated
    # paths returned 200 and 8/8 un-enumerated ones returned 401 TOKEN_INVALID:
    #
    #   200  /api/admin/console/registry    401  /api/admin/org-nodes
    #   200  /api/admin/audit               401  /api/admin/me
    #   200  /api/admin/accounts            401  /api/admin/operators
    #                                       401  /api/admin/operators/grantable-roles
    #                                       401  /api/admin/roles
    #                                       401  /api/admin/permissions
    #                                       401  /api/admin/groups
    #                                       401  /api/admin/partnerships
    #
    # The console's whole IAM administration section was 401. Note which way the
    # ADR requirement points: the ENUMERATION was the undeclared deviation — it
    # made the gateway verify operator JWTs on 8+ paths — not this subtree.
    #
    # "public" here means "the gateway performs no JWT verification", NOT
    # "unauthenticated": routing, rate-limit, request-id, CORS and spoofed-header
    # stripping all still run, and admin-service authenticates then authorizes
    # (RBAC by DB lookup on every request, rbac.md D5).
    #
    # The five verbs are the ones admin-service actually maps under /api/admin.
    # OPTIONS is deliberately absent — CORS preflight is the gateway's globalcors
    # concern and no admin controller maps it; that was equally true of the
    # enumeration this replaces, so nothing changes there.
    - GET:/api/admin/**
    - POST:/api/admin/**
    - PUT:/api/admin/**
    - PATCH:/api/admin/**
    - DELETE:/api/admin/**
    - GET:/.well-known/admin/**

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
