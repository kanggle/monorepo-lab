<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- TASK-BE-613 (ADR-007 D5-A): the same branding as the login page this flow came from. -->
    <title th:text="${branding.signupTitle()}">IAM 회원가입</title>
    <style th:replace="~{fragments/auth-page :: styles}"></style>
</head>
<body th:style="|--brand: ${branding.primaryColor()}|">
<div class="card">
    <div th:replace="~{fragments/auth-page :: brand-header(${branding.signupTitle()}, null)}"></div>

    <!-- fix-001: errors are rendered server-side after the proxy call (no client fetch). -->
    <div class="error" id="form-error" th:if="${error != null}" th:text="${error}" role="alert">error</div>
    <!-- TASK-BE-613: the client-side pre-check writes here instead of window.alert(). -->
    <div class="error" id="client-error" role="alert" hidden></div>

    <!-- TASK-BE-581: when the initiating client's tenant cannot accept a signup at all, the
         form is not rendered. Leaving it visible and letting the POST fail is what produced
         the reported defect: a permanent 404 TENANT_NOT_FOUND surfaced as "the auth service
         is temporarily unavailable" (TASK-BE-580). -->
    <form th:if="${!signupBlocked}" th:action="@{/signup}" method="post" id="signup-form"
          data-busy-label="가입 중…">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <label for="email">이메일</label>
        <input type="email" id="email" name="email" autocomplete="email"
               th:value="${email}" required autofocus
               th:aria-describedby="${error != null} ? 'form-error' : null"/>

        <label for="displayName">표시 이름 <span style="color:#666">(선택)</span></label>
        <input type="text" id="displayName" name="displayName" autocomplete="name"
               th:value="${displayName}" maxlength="100"/>

        <label for="password">비밀번호</label>
        <div class="password-field">
            <input type="password" id="password" name="password" autocomplete="new-password" required
                   th:aria-describedby="${error != null} ? 'password-hint form-error' : 'password-hint'"/>
            <button type="button" class="password-toggle" data-password-toggle
                    aria-controls="password" aria-pressed="false" aria-label="비밀번호 표시" hidden>표시</button>
        </div>
        <p class="hint" id="password-hint">8자 이상, 대문자·소문자·숫자·특수문자 중 3종 이상.</p>

        <label for="confirmPassword">비밀번호 확인</label>
        <div class="password-field">
            <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required/>
            <button type="button" class="password-toggle" data-password-toggle
                    aria-controls="confirmPassword" aria-pressed="false" aria-label="비밀번호 확인 표시" hidden>표시</button>
        </div>

        <button type="submit" class="primary">회원가입</button>
    </form>

    <div class="footer">
        이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a>
    </div>
</div>

<!-- Progressive enhancement: block an obvious mismatch/short password before the round-trip.
     The server re-validates regardless (source of truth). -->
<!-- TASK-BE-581: suppressed together with the form. This script does
     document.getElementById('signup-form').addEventListener(...) unconditionally, so leaving
     it on a page that renders no form throws a TypeError on load. -->
<!-- TASK-BE-613: registered BEFORE the shared enhance script, so its preventDefault() is
     visible to the busy-state handler (which then leaves the button enabled). -->
<script th:if="${!signupBlocked}" th:inline="none">
    (function () {
        var form = document.getElementById('signup-form');
        var box = document.getElementById('client-error');
        form.addEventListener('submit', function (e) {
            var pw = document.getElementById('password').value;
            var cpw = document.getElementById('confirmPassword').value;
            var message = null;
            if (pw.length < 8) {
                message = '비밀번호는 8자 이상이어야 합니다.';
            } else if (pw !== cpw) {
                message = '비밀번호가 일치하지 않습니다.';
            }
            if (message) {
                e.preventDefault();
                box.textContent = message;
                box.hidden = false;
            } else {
                box.hidden = true;
            }
        });
    })();
</script>
<script th:replace="~{fragments/auth-page :: enhance}"></script>
</body>
</html>
