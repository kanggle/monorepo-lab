<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- TASK-BE-627 (TASK-MONO-770 의 남은 화면, ADR-MONO-080 D3) — 재설정 메일의 링크가
         도착하는 곳. 토큰은 hidden 필드로만 돌아간다(R4 — 화면 텍스트로도, 로그에도 쓰지
         않는다). 🔴 정책 위반으로 다시 그릴 때도 토큰은 유지하지만(Failure Scenario 3)
         새 비밀번호 입력은 절대 다시 채우지 않는다 — 아래 폼에 newPassword/confirmPassword
         th:value 가 없는 것은 실수가 아니다. -->
    <title>비밀번호 재설정</title>
    <style th:replace="~{fragments/auth-page :: styles}"></style>
</head>
<body th:style="|--brand: ${branding.primaryColor()}|">
<main class="card">
    <div th:replace="~{fragments/auth-page :: brand-header('비밀번호 재설정', null)}"></div>

    <th:block th:switch="${result}">
        <div th:case="'NO_TOKEN'" class="notice" id="reset-result" role="status">
            비밀번호 재설정 링크가 필요합니다. 아래에서 재설정을 요청해 주세요.
        </div>
        <div th:case="'TOKEN_INVALID'" class="error" id="reset-result" role="alert">
            링크가 만료되었거나 이미 사용되었습니다.
        </div>
        <div th:case="'POLICY_VIOLATION'" class="error" id="reset-result" role="alert">
            비밀번호는 8자 이상이며 대문자·소문자·숫자·특수문자 중 3종 이상이어야 하고, 이메일 주소를 포함할 수 없습니다.
        </div>
        <div th:case="'PASSWORD_MISMATCH'" class="error" id="reset-result" role="alert">
            비밀번호가 일치하지 않습니다.
        </div>
        <div th:case="'UNAVAILABLE'" class="error" id="reset-result" role="alert">
            지금은 처리할 수 없습니다. 잠시 뒤 다시 시도해 주세요 — 같은 링크로 다시 됩니다.
        </div>
    </th:block>

    <form th:if="${token != null}" action="/password-reset" th:action="@{/password-reset}" method="post"
          data-busy-label="저장하는 중…" id="reset-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="token" th:value="${token}"/>

        <label for="newPassword">새 비밀번호</label>
        <div class="password-field">
            <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" required
                   th:aria-describedby="${result == 'POLICY_VIOLATION' or result == 'PASSWORD_MISMATCH'} ? 'reset-password-hint reset-result' : 'reset-password-hint'"/>
            <button type="button" class="password-toggle" data-password-toggle
                    aria-controls="newPassword" aria-pressed="false" aria-label="새 비밀번호 표시" hidden>표시</button>
        </div>
        <p class="hint" id="reset-password-hint">8자 이상, 대문자·소문자·숫자·특수문자 중 3종 이상.</p>

        <label for="confirmPassword">새 비밀번호 확인</label>
        <div class="password-field">
            <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required/>
            <button type="button" class="password-toggle" data-password-toggle
                    aria-controls="confirmPassword" aria-pressed="false" aria-label="새 비밀번호 확인 표시" hidden>표시</button>
        </div>

        <button type="submit" class="primary">비밀번호 변경</button>
    </form>

    <p class="footer" th:if="${result == 'NO_TOKEN' or result == 'TOKEN_INVALID'}">
        <a th:href="@{/password-reset/request}">재설정 메일 다시 요청</a>
    </p>
</main>
<!-- Progressive enhancement only: the server re-validates regardless (source of truth). Same
     shape as signup.html's pre-check. -->
<script th:if="${token != null}" th:inline="none">
    (function () {
        var form = document.getElementById('reset-form');
        form.addEventListener('submit', function (e) {
            var pw = document.getElementById('newPassword').value;
            var cpw = document.getElementById('confirmPassword').value;
            if (pw.length < 8) {
                e.preventDefault();
                window.alert('비밀번호는 8자 이상이어야 합니다.');
            } else if (pw !== cpw) {
                e.preventDefault();
                window.alert('비밀번호가 일치하지 않습니다.');
            }
        });
    })();
</script>
<script th:replace="~{fragments/auth-page :: enhance}"></script>
</body>
</html>
