<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- TASK-BE-627 (TASK-MONO-770 의 남은 화면, ADR-MONO-080 D3) — 비밀번호 재설정 메일을
         요청하는 화면. PasswordResetPageController; RequestPasswordResetUseCase 는 계정 존재
         여부를 절대 드러내지 않는다 — 있는 이메일 · 없는 이메일 · 홍수 제한에 걸린 요청 전부
         같은 결과로 돌아온다. 🔴 이 화면도 그 셋에 대해 반드시 같은 문구를 보여준다(AC-1) —
         SENT 분기 외에 계정 상태를 암시하는 분기를 추가하지 말 것. -->
    <title>비밀번호 재설정</title>
    <style th:replace="~{fragments/auth-page :: styles}"></style>
</head>
<body th:style="|--brand: ${branding.primaryColor()}|">
<main class="card">
    <div th:replace="~{fragments/auth-page :: brand-header('비밀번호 재설정', null)}"></div>

    <th:block th:switch="${result}">
        <div th:case="'EMAIL_REQUIRED'" class="error" id="request-result" role="alert">
            이메일을 입력해 주세요.
        </div>
        <div th:case="'SENT'" class="notice" id="request-result" role="status">
            계정이 있다면 비밀번호 재설정 메일을 보냈습니다. 메일함의 링크를 열어 새 비밀번호를 설정해 주세요.
        </div>
        <div th:case="'UNAVAILABLE'" class="error" id="request-result" role="alert">
            잠시 후 다시 시도해 주세요.
        </div>
    </th:block>

    <th:block th:if="${result == null or result == 'EMAIL_REQUIRED' or result == 'UNAVAILABLE'}">
        <p class="consent-text" id="request-text">
            가입할 때 쓴 이메일 주소를 입력하면 비밀번호를 재설정할 수 있는 링크를 보내드립니다.
        </p>
        <form action="/password-reset/request" th:action="@{/password-reset/request}" method="post"
              aria-describedby="request-text" data-busy-label="보내는 중…">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" autocomplete="email"
                   th:value="${email}" required autofocus
                   th:aria-invalid="${result != null} ? 'true' : null"
                   th:aria-describedby="${result != null} ? 'request-result' : null"/>
            <button type="submit" class="primary">재설정 메일 보내기</button>
        </form>
    </th:block>

    <p class="footer"><a th:href="@{/login}">로그인으로 돌아가기</a></p>
</main>
<script th:replace="~{fragments/auth-page :: enhance}"></script>
</body>
</html>
