# E2E profile — docker-compose.e2e.yml driven overrides.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:auth_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:auth_user}
    password: ${DB_PASSWORD:auth_pass}
    # TASK-BE-045: tolerate MySQL warmup under simultaneous cold-start connection
    # bursts (4 services). connection-timeout raised to 60s so HikariCP's first
    # checkFailFast probe waits through MySQL's post-healthy init window;
    # initialization-fail-timeout mirrors it so pool init retries the same window;
    # maximum-pool-size capped at 5 so 4 services' combined pool sits well under
    # MySQL's (now 500) connection cap.
    hikari:
      connection-timeout: 60000
      initialization-fail-timeout: 60000
      maximum-pool-size: 5
  flyway:
    enabled: true
    # TASK-BE-571: migration-dev carries the demo-only credential seed, present at
    # startup ONLY under this profile. The default profile (application.yml) and
    # production stay pinned to db/migration alone, so the demo credentials can
    # never reach a production auth_db — the same split account-service uses
    # (application.yml = migration; application-e2e.yml = migration + migration-dev).
    locations: classpath:db/migration,classpath:db/migration-dev
    baseline-on-migrate: false
    # TASK-MONO-524 — LEGACY TOLERANCE, scoped to the only profile that loads
    # migration-dev. Until 2026-08-12 the dev seeds in that directory were
    # V9001/V9002; any database that applied them carries those rows in
    # flyway_schema_history FOREVER, and 9002 stays the highest applied version.
    # Every production migration added afterwards therefore resolves BELOW it =
    # out-of-order, which Flyway rejects → the service does not start. That is
    # not a hypothetical: auth_db crash-looped on V0032 the day it landed.
    #
    # 🔴 Converting the files to R__ does NOT fix an existing database. Measured
    # (TASK-MONO-524 § experiment B): with the V9xxx files gone, Flyway still
    # refuses — the 9001/9002 HISTORY ROWS are what poison the ordering, and it
    # silently classifies them as `future` rather than complaining about them.
    # The defect lives in the history table, not in the file listing.
    #
    # So this flag is what actually lets an already-poisoned host boot. It is a
    # compatibility shim with a stated sunset: once no database in circulation
    # has a version >= 9000 row (see the recovery procedure in
    # projects/iam-platform/docs/flyway-dev-seed-migrations.md), it becomes a
    # no-op and can be deleted. It is deliberately NOT in application.yml —
    # production and the default profile never load migration-dev, never carry
    # a V9000 row, and keep ordering as a hard invariant.
    out-of-order: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

logging:
  level:
    root: INFO
  file:
    name: ""
