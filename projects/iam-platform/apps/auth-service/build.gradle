plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    // Internal libs
    implementation project(':libs:java-common')
    implementation project(':libs:java-web')
    implementation project(':libs:java-web-servlet')
    implementation project(':libs:java-messaging')
    implementation project(':libs:java-security')
    implementation project(':libs:java-observability')

    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // TASK-BE-396 (ADR-006): custom /login page renders the social-login buttons +
    // password form via Thymeleaf, replacing the default-generated form.
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Spring Authorization Server (OIDC / OAuth2 AS) — TASK-BE-251
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-authorization-server'

    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // Flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // MySQL
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // JJWT (for parsing refresh tokens)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Resilience4j (circuit breaker + retry)
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-retry:2.2.0'

    // RestClient (Spring 6.1+)

    // Test
    // TASK-BE-078: AbstractIntegrationTest lives in testFixtures source set so
    // Testcontainers classes stay out of the production classpath.
    testImplementation testFixtures(project(':libs:java-test-support'))
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'com.redis:testcontainers-redis:2.2.2'
    testImplementation 'com.jayway.jsonpath:json-path'
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'org.wiremock:wiremock-standalone:3.9.1'
    // H2 for SAS slice tests (no Testcontainers MySQL required)
    testRuntimeOnly 'com.h2database:h2'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

// TASK-MONO-512 — the demo-seed guards read files OUTSIDE this module, and Gradle
// cannot know that.
//
// `DemoSeedCredentialTest` and `FanArtistDemoSeedTest` exist to catch drift between
// seed files that live in three trees (this module's migration-dev, account-service's
// and admin-service's, and infra/demo/seed/). They open those files by path, which is
// invisible to up-to-date checking: change ONLY the sibling file and this `test` task
// stays UP-TO-DATE, so the guard does not run and the job reports green over exactly
// the drift it was written to detect.
//
// Measured, not assumed: mutating an account id in account-service's R__06 (then V9006) left
// `:test` UP-TO-DATE and green; forced to re-run against the same tree it failed 3 of
// 5 cases. Declaring the files as inputs makes the sibling edit invalidate the task.
//
// 🔴 Residual gap, stated so it is not mistaken for coverage: ci.yml's `iam` path
// filter is `projects/iam-platform/**`, so a PR touching ONLY infra/demo/seed/seed-fan.sh
// does not wake this lane at all — no Gradle input can fix that.
//
// 🔴 THIS GAP IS UNOWNED, and that correction matters. The line here used to read
// "TASK-MONO-522 inherits the question of where a cross-tree agreement guard should be
// scheduled." TASK-MONO-522 closed (ADR-MONO-063 ACCEPTED — D1) WITHOUT taking it: D1 is a
// decision about the artist directory's write plane, and the CI path-filter question is a
// different axis it never touched. Left as written, the sentence would have named a closed
// ticket as the owner — which reads as covered and is the more expensive of the two errors
// (nobody re-files work that appears assigned). ADR-MONO-063 § rider 대조 records it as
// explicitly unassigned. It needs its own ticket; it does not have one.
tasks.named('test') {
    inputs.file(rootProject.file('projects/iam-platform/apps/account-service/src/main/resources/db/migration-dev/R__06_seed_fan_artist_accounts_and_artist_role.sql'))
            .withPropertyName('fanArtistAccountSeed')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(rootProject.file('infra/demo/seed/seed-fan.sh'))
            .withPropertyName('fanDemoSeedScript')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // The pre-existing sibling of the same shape: DemoSeedCredentialTest pins
    // admin_operators.oidc_subject against this module's iam-tenant credential and had
    // the same blind spot. Same defect, same line — fixing one and leaving the other is
    // how the next person concludes the mechanism does not work.
    inputs.file(rootProject.file('projects/iam-platform/apps/admin-service/src/main/resources/db/migration-dev/R__seed_demo_operator.sql'))
            .withPropertyName('demoOperatorSeed')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}

// TASK-BE-581 — same blind spot, different task. OAuthClientTenantReferenceIntegrationTest
// derives its verdict from files OUTSIDE this module: account-service's tenant migrations (the
// population it judges against), admin-service's reserved-word constant, and multi-tenancy.md.
// Without these declarations, adding an oauth client that points at a tenant nobody seeds — or
// deleting the tenant a client depends on — leaves `integrationTest` UP-TO-DATE and the lane
// reports green over exactly the drift the guard was written to detect.
//
// Declared on `integrationTest` (not `test`) because the guard is @Tag("integration"); the
// `test` task excludes that tag, so an input there would gate a task that never runs it.
// `tasks.matching` rather than `tasks.named` — `integrationTest` is registered by the parent
// project's `subprojects {}` block, so this file must not depend on evaluation order.
tasks.matching { it.name == 'integrationTest' }.configureEach {
    inputs.dir(rootProject.file('projects/iam-platform/apps/account-service/src/main/resources/db/migration'))
            .withPropertyName('accountServiceProdMigrations')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir(rootProject.file('projects/iam-platform/apps/account-service/src/main/resources/db/migration-dev'))
            .withPropertyName('accountServiceDevMigrations')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(rootProject.file('projects/iam-platform/apps/admin-service/src/main/java/com/example/admin/application/tenant/CreateTenantUseCase.java'))
            .withPropertyName('reservedTenantSlugSource')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(rootProject.file('projects/iam-platform/specs/features/multi-tenancy.md'))
            .withPropertyName('multiTenancySpec')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}
