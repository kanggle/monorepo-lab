plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    // Internal libs
    implementation project(':libs:java-common')
    implementation project(':libs:java-web')
    implementation project(':libs:java-web-servlet')
    implementation project(':libs:java-messaging')
    implementation project(':libs:java-security')
    implementation project(':libs:java-observability')

    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // TASK-BE-396 (ADR-006): custom /login page renders the social-login buttons +
    // password form via Thymeleaf, replacing the default-generated form.
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Spring Authorization Server (OIDC / OAuth2 AS) — TASK-BE-251
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-authorization-server'

    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // Flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // MySQL
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // JJWT (for parsing refresh tokens)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Resilience4j (circuit breaker + retry)
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-retry:2.2.0'

    // RestClient (Spring 6.1+)

    // Test
    // TASK-BE-078: AbstractIntegrationTest lives in testFixtures source set so
    // Testcontainers classes stay out of the production classpath.
    testImplementation testFixtures(project(':libs:java-test-support'))
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'com.redis:testcontainers-redis:2.2.2'
    testImplementation 'com.jayway.jsonpath:json-path'
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'org.wiremock:wiremock-standalone:3.9.1'
    // H2 for SAS slice tests (no Testcontainers MySQL required)
    testRuntimeOnly 'com.h2database:h2'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

// TASK-MONO-512 — the demo-seed guards read files OUTSIDE this module, and Gradle
// cannot know that.
//
// `DemoSeedCredentialTest` and `FanArtistDemoSeedTest` exist to catch drift between
// seed files that live in three trees (this module's migration-dev, account-service's
// and admin-service's, and infra/demo/seed/). They open those files by path, which is
// invisible to up-to-date checking: change ONLY the sibling file and this `test` task
// stays UP-TO-DATE, so the guard does not run and the job reports green over exactly
// the drift it was written to detect.
//
// Measured, not assumed: mutating an account id in account-service's V9006 left
// `:test` UP-TO-DATE and green; forced to re-run against the same tree it failed 3 of
// 5 cases. Declaring the files as inputs makes the sibling edit invalidate the task.
//
// 🔴 Residual gap, stated so it is not mistaken for coverage: ci.yml's `iam` path
// filter is `projects/iam-platform/**`, so a PR touching ONLY infra/demo/seed/seed-fan.sh
// does not wake this lane at all — no Gradle input can fix that. TASK-MONO-522 inherits
// the question of where a cross-tree agreement guard should be scheduled.
tasks.named('test') {
    inputs.file(rootProject.file('projects/iam-platform/apps/account-service/src/main/resources/db/migration-dev/V9006__seed_fan_artist_accounts_and_artist_role.sql'))
            .withPropertyName('fanArtistAccountSeed')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(rootProject.file('infra/demo/seed/seed-fan.sh'))
            .withPropertyName('fanDemoSeedScript')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // The pre-existing sibling of the same shape: DemoSeedCredentialTest pins
    // admin_operators.oidc_subject against this module's iam-tenant credential and had
    // the same blind spot. Same defect, same line — fixing one and leaving the other is
    // how the next person concludes the mechanism does not work.
    inputs.file(rootProject.file('projects/iam-platform/apps/admin-service/src/main/resources/db/migration-dev/R__seed_demo_operator.sql'))
            .withPropertyName('demoOperatorSeed')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}
