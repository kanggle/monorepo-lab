groups:
  - name: platform.availability
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is DOWN"
          description: "Prometheus target {{ $labels.job }} ({{ $labels.instance }}) has been down for 2 minutes."
          runbook: "knowledge/runbooks/service-down.md"

      - alert: HighErrorRate5xx
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (service)
            /
          sum(rate(http_server_requests_seconds_count[5m])) by (service)
            > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} 5xx error rate > 5%"
          description: "5xx error rate for {{ $labels.service }} exceeded 5% for 5 minutes."
          runbook: "knowledge/runbooks/high-error-rate-5xx.md"

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le, service)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} p99 latency > 1s"
          description: "p99 latency for {{ $labels.service }} exceeded 1 second for 5 minutes."
          runbook: "knowledge/runbooks/high-latency-p99.md"

  - name: gateway.rules
    interval: 30s
    rules:
      - alert: GatewayJwtFailureSpike
        # TASK-MONO-834: the spec's result values are valid / expired / invalid_signature /
        # missing (gateway-service/observability.md) — there is no "failure". Count every
        # non-valid outcome, which is what "validation failure" meant.
        expr: sum(rate(gateway_jwt_validation_total{result!="valid"}[5m])) > 5
        for: 5m
        labels:
          severity: warning
          service: gateway-service
        annotations:
          summary: "Gateway JWT validation failure spike"
          description: "More than 5 JWT validation failures per second over 5 minutes."
          runbook: "knowledge/runbooks/gateway-jwt-failure-spike.md"

      - alert: GatewayRateLimitExceeded
        expr: rate(gateway_ratelimit_rejected_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          service: gateway-service
        annotations:
          summary: "Gateway rate limit rejections elevated"
          runbook: "knowledge/runbooks/gateway-rate-limit-exceeded.md"

  - name: auth.rules
    interval: 30s
    rules:
      - alert: AuthLoginFailureSpike
        expr: rate(auth_login_total{result="failure"}[5m]) > 20
        for: 5m
        labels:
          severity: warning
          service: auth-service
        annotations:
          summary: "Login failure rate spike"
          runbook: "knowledge/runbooks/auth-login-failure-spike.md"

      - alert: AuthRefreshTokenReuseDetected
        expr: increase(auth_token_reuse_detected_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: auth-service
        annotations:
          summary: "Refresh token reuse detected"
          description: "Potential token theft. Investigate immediately."
          runbook: "knowledge/runbooks/auth-refresh-token-reuse.md"

      # TASK-BE-665 (spec auth-service/observability.md § Alerts). account-service down →
      # AccountServiceClient fails closed → login is impossible. These failures are deliberately
      # NOT counted in auth_login_total{result="failure"} (TASK-BE-664 — that would fire the
      # credential-stuffing alert), so this is the alert that owns them. The series exists only
      # because the breaker lives in Spring's CircuitBreakerRegistry (resilience4j-micrometer);
      # label shape taken from a real scrape in AccountServiceCircuitBreakerMetricsTest.
      - alert: AuthAccountServiceDown
        expr: max(resilience4j_circuitbreaker_state{service="auth-service",name="accountService",state=~"open|forced_open"}) == 1
        for: 1m
        labels:
          severity: critical
          service: auth-service
        annotations:
          summary: "auth-service circuit breaker to account-service is open"
          description: "Logins fail closed while account-service is unreachable. Check account-service health."
          runbook: "knowledge/runbooks/auth-account-service-down.md"

      - alert: AuthOutboxLagHigh
        expr: auth_outbox_lag_seconds > 60
        for: 5m
        labels:
          severity: warning
          service: auth-service
        annotations:
          summary: "Auth outbox lag exceeds 60 seconds"
          runbook: "knowledge/runbooks/auth-outbox-lag-high.md"

  - name: account.rules
    interval: 30s
    rules:
      - alert: AccountOutboxLagHigh
        expr: account_outbox_lag_seconds > 60
        for: 5m
        labels:
          severity: warning
          service: account-service
        annotations:
          summary: "Account outbox lag exceeds 60 seconds"
          runbook: "knowledge/runbooks/account-outbox-lag-high.md"

      # TASK-MONO-834: AccountDbSlowQueries was removed. It queried
      # hibernate_query_execution_seconds_bucket, which nothing exports — Hibernate statistics
      # are not enabled in any iam service and no spec asks for them — so it could never fire.
      # Turning statistics on is a performance/design decision, not an alert-file edit.

  - name: security.rules
    interval: 30s
    rules:
      - alert: SecurityConsumerLagHigh
        expr: kafka_consumer_fetch_manager_records_lag_max{service="security-service"} > 10000
        for: 10m
        labels:
          severity: critical
          service: security-service
        annotations:
          summary: "Security consumer lag > 10000"
          runbook: "knowledge/runbooks/security-consumer-lag-high.md"

      - alert: SecurityDlqDepthHigh
        expr: security_dlq_depth > 100
        for: 5m
        labels:
          severity: warning
          service: security-service
        annotations:
          summary: "Security DLQ depth exceeds 100"
          runbook: "knowledge/runbooks/security-dlq-depth-high.md"

      - alert: SecurityAutoLockSpike
        expr: rate(security_auto_lock_issued_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          service: security-service
        annotations:
          summary: "Auto-lock rate elevated"
          runbook: "knowledge/runbooks/security-auto-lock-spike.md"

  - name: admin.rules
    interval: 30s
    rules:
      - alert: AdminActionSpike
        expr: rate(admin_command_total[5m]) > 5
        for: 10m
        labels:
          severity: warning
          service: admin-service
        annotations:
          summary: "Admin action rate unusually high"
          runbook: "knowledge/runbooks/admin-action-spike.md"

      - alert: AdminCommandFailureHigh
        expr: |
          sum(rate(admin_command_total{outcome="failure"}[10m]))
            /
          sum(rate(admin_command_total[10m]))
            > 0.2
        for: 10m
        labels:
          severity: critical
          service: admin-service
        annotations:
          summary: "Admin-service command failure ratio > 20%"
          runbook: "knowledge/runbooks/admin-command-failure-high.md"
