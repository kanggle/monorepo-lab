# ============================================================
# MinIO (S3-compatible object storage) for dev/staging k8s
# ------------------------------------------------------------
# Runs in the `infra` namespace alongside postgres / redis / kafka.
# Production environments replace this with AWS S3 + CloudFront;
# the `storage-credentials` SealedSecret and the STORAGE_* keys in
# the `infrastructure-endpoints` ConfigMap are the stable contract
# that services bind to, regardless of backend.
#
# See: specs/platform/object-storage-policy.md
#
# Prerequisite: `infra` namespace exists (provisioned outside this repo).
# ============================================================
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: infra
  labels:
    app: minio
spec:
  clusterIP: None
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
  selector:
    app: minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: infra
  labels:
    app: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          # TASK-BE-591 → TASK-BE-598: Docker Hub 에 이어 quay.io/minio 도 익명 pull 을 닫았다.
          # compose 와 같은 출처·같은 MinIO 릴리스(Bitnami 빌드, 다이제스트 고정). 이 이미지의
          # ENTRYPOINT 는 Bitnami 셸 스크립트라 `server …` 를 그대로 exec 하려 든다 — 그래서
          # command 로 minio 바이너리를 직접 지정하고 args 는 예전 그대로 둔다.
          # TASK-MONO-734: compose 와 같이 GHCR 사본(원본과 digest 동일)으로 옮겼다.
          image: ghcr.io/kanggle/mirror-minio:2024.10.13-debian-12-r1@sha256:faf554135d50ff8b382f79df7795e080726cb2d6f4ce7f056d733a6437546f6a
          imagePullPolicy: IfNotPresent
          command:
            - /opt/bitnami/minio/bin/minio
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: storage-credentials
                  key: STORAGE_S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: storage-credentials
                  key: STORAGE_S3_SECRET_KEY
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
---
# Mirror of `storage-credentials` into the `infra` namespace so MinIO can read
# its own root credentials. Services consume the same secret from the
# `ecommerce` namespace (see k8s/base/secrets.yaml).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: storage-credentials
  namespace: infra
spec:
  encryptedData:
    STORAGE_S3_ACCESS_KEY: AgBy3i4OJSWK+PiTySYZZA9rO... # sealed by kubeseal — replace
    STORAGE_S3_SECRET_KEY: AgBy3i4OJSWK+PiTySYZZA9rO... # sealed by kubeseal — replace
  template:
    metadata:
      name: storage-credentials
      namespace: infra
    type: Opaque
---
# One-shot Job: create the product-images bucket (private — no anonymous access).
# Idempotent — re-runs safely. Apply after the StatefulSet is Ready.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  namespace: infra
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: minio-init
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          # TASK-BE-591 → TASK-BE-598: 위 minio 와 같은 사유·같은 출처(같은 mc 릴리스).
          # command 가 /bin/sh 라 Bitnami ENTRYPOINT 는 안 돈다. mc 는 이미지 PATH 에 있다.
          # TASK-MONO-734: GHCR 사본(원본과 digest 동일).
          image: ghcr.io/kanggle/mirror-minio-client:2024.10.8-debian-12-r1@sha256:c3e82110529b30658cdcdf6414619fe901c2ec820eba973bda936cdcb4c6193c
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # mc writes ~/.mc config
            capabilities:
              drop:
                - "ALL"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: storage-credentials
                  key: STORAGE_S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: storage-credentials
                  key: STORAGE_S3_SECRET_KEY
            - name: PRODUCT_IMAGES_BUCKET
              value: "firstproject-dev-product-images"
            # TASK-BE-598: 이 이미지는 HOME=/ 이고 설정 디렉터리 /.mc 는 root 그룹(0:0 775)만
            # 쓸 수 있다. 여기 Job 은 1000:1000 으로 돌므로 mc 설정을 /tmp(1777) 로 보낸다.
            - name: MC_CONFIG_DIR
              value: "/tmp/.mc"
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing local/"$PRODUCT_IMAGES_BUCKET"
