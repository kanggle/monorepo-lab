plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    // Shared Web
    implementation project(':libs:java-web')

    // Servlet-stack exception scaffolding — CommonGlobalExceptionHandler (ADR-MONO-058 § D2)
    implementation project(':libs:java-web-servlet')

    // Common
    implementation project(':libs:java-common')

    // Circuit breaker + retry types returned by ResilienceClientFactory — java-common declares them
    // `implementation`, so a consumer that holds the returned objects must declare them too
    // (promotion-service coupon client, TASK-INT-026).
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-retry:2.2.0'

    // Messaging (Outbox pattern)
    implementation project(':libs:java-messaging')

    // Observability
    implementation project(':libs:java-observability')
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Security — resource server for the internal /api/internal/** route only
    // (TASK-BE-412): validates the inbound client_credentials Bearer JWT. The
    // gateway-fronted user routes (/api/orders/**, /api/admin/orders/**) keep the
    // X-User-* header-trust model via a permissive second filter chain.
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // OpenAPI / Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // Flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'

    // H2 (local standalone profile)
    runtimeOnly 'com.h2database:h2'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    // MockWebServer serves a local JWKS so the resource-server IT can mint a valid
    // client_credentials JWT signed by a per-run RSA key (TASK-BE-412). nimbus-jose-jwt
    // arrives transitively via spring-boot-starter-oauth2-resource-server.
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

test {
    environment 'DOCKER_HOST', 'npipe:////./pipe/docker_engine_linux'
    jvmArgs '-Dapi.version=1.44'

    // TASK-MONO-710 — `EcommerceOrderDemoSeedTest` opens a file OUTSIDE this module by path
    // (`infra/demo/seed/seed-ecommerce.sh`), which is invisible to Gradle's up-to-date check.
    // Without this declaration, a commit that edits ONLY the seed leaves `:test` UP-TO-DATE, so
    // the guard does not run and the lane reports green over exactly the drift it was written to
    // detect (measured twice already in this repo: TASK-MONO-512 in iam, TASK-MONO-683 in wms).
    //
    // The Gradle half alone is not enough: ci.yml's PR path filter must ALSO list this exact file
    // under the `ecommerce` key, or a PR touching only the seed never wakes `Build & Test` and the
    // first red run is on `main` after merge. `scripts/check-outside-module-input-filter-
    // coverage.sh` (wired as its own `changes`-gated CI job) asserts the two stay in sync, so
    // adding one without the other fails that job by name.
    inputs.file(rootProject.file('infra/demo/seed/seed-ecommerce.sh'))
            .withPropertyName('ecommerceDemoSeedScript')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}

// Dedicated task that runs ONLY @Tag("integration") Testcontainers ITs (TASK-MONO-307).
// Mirrors the sibling pattern (scm/finance/erp/console-bff). Crucially it does NOT inherit
// the `test` task's local-Windows `DOCKER_HOST=npipe:…` / `api.version=1.44` override above —
// it picks up the root build.gradle `tasks.withType(Test).configureEach` Docker env instead
// (conditional DOCKER_HOST + DOCKER_API_VERSION=1.45), which is correct on a Linux CI runner.
// Not wired into `check`, so the Docker-free fast feedback loop stays unchanged (AC-3).
tasks.register('integrationTest', Test) {
    description = 'Runs Testcontainers-backed @Tag("integration") integration tests (requires Docker).'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')

    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = true
    }

    // Generous per-test timeout — embedded-Kafka + Postgres-container cold start on CI.
    systemProperty 'junit.jupiter.execution.timeout.default', '5m'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        mavenBom "org.testcontainers:testcontainers-bom:1.21.3"
    }
}
