# wms-platform Prometheus alert rules — loaded by infra/prometheus/prometheus.yml (`rule_files`).
#
# 🔴 TASK-MONO-834 (2026-11-24 UTC): this file used to be a verbatim copy of iam-platform's
#    rules. Every alert below the availability group named an iam service (Auth*, Account*,
#    Security*, Admin*, the iam gateway's JWT/rate-limit counters) and queried metrics no wms
#    service exports, so none of them could ever fire — and no wms service had an alert of its
#    own. What remains is the platform-wide group (framework metrics + the `service` label that
#    prometheus.yml attaches to each wms scrape job) and alerts on metrics wms services actually
#    register. `scripts/check-alert-rule-metrics.sh` now fails CI when a rule here names a metric
#    nothing exports.
#
#    Not carried over from the iam copy, on purpose: GatewayRateLimitExceeded — the wms gateway
#    uses libs/java-gateway's FailOpenRateLimiter, which does not export
#    `gateway_ratelimit_rejected_total` (only iam's own gateway registers that name).
groups:
  - name: platform.availability
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is DOWN"
          description: "Prometheus target {{ $labels.job }} ({{ $labels.instance }}) has been down for 2 minutes."
          runbook: "docs/runbooks/service-down.md"

      - alert: HighErrorRate5xx
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (service)
            /
          sum(rate(http_server_requests_seconds_count[5m])) by (service)
            > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} 5xx error rate > 5%"
          description: "5xx error rate for {{ $labels.service }} exceeded 5% for 5 minutes."
          runbook: "docs/runbooks/high-error-rate-5xx.md"

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le, service)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} p99 latency > 1s"
          description: "p99 latency for {{ $labels.service }} exceeded 1 second for 5 minutes."
          runbook: "docs/runbooks/high-latency-p99.md"

  # ──────────────────────────────────────────────
  # Transactional outbox. Every wms service that publishes events registers a
  # `<service>.outbox.pending.count` gauge (unpublished rows). Threshold 100 is the one the
  # wms specs already state — e.g. specs/services/notification-service/external-integrations.md
  # ("alerts at pending.count > 100"), inbound/outbound external-integrations.md ("grows; alerts
  # at >100"). Names are spelled out rather than matched by a __name__ regex so the metric guard
  # can check each one.
  # ──────────────────────────────────────────────
  - name: wms.outbox
    interval: 30s
    rules:
      - alert: WmsOutboxBacklogHigh
        expr: |
          max by (service) (master_outbox_pending_count) > 100
            or max by (service) (inbound_outbox_pending_count) > 100
            or max by (service) (inventory_outbox_pending_count) > 100
            or max by (service) (outbound_outbox_pending_count) > 100
            or max by (service) (notification_outbox_pending_count) > 100
            or max by (service) (admin_outbox_pending_count) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} outbox backlog > 100 unpublished rows"
          description: "Unpublished outbox rows for {{ $labels.service }} stayed above 100 for 5 minutes — the relay is stuck or the broker is unreachable."

      # Only admin-service and notification-service register a publish-failure counter
      # (AdminOutboxPublisher, OutboxPollingScheduler). Their spec rows (TASK-MONO-833) say
      # "alert on a sustained non-zero rate": one failure is retried with backoff and is
      # not news; failures in every minute of a 10-minute window are.
      - alert: WmsOutboxPublishFailing
        expr: |
          sum by (service) (rate(admin_outbox_publish_failure_total[5m])) > 0
            or sum by (service) (rate(notification_outbox_publish_failure_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} outbox publishing keeps failing"
          description: "Outbox publish failures for {{ $labels.service }} have not stopped for 10 minutes."
