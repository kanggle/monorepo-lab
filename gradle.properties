org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

springBootVersion=3.4.1
springCloudVersion=2024.0.0
javaVersion=21

# Third-party versions shared by many modules (TASK-MONO-829). One value per
# coordinate family; every build file references the property, and
# scripts/check-gradle-managed-versions.sh fails on a literal version for these.
testcontainersVersion=1.21.3
testcontainersRedisVersion=2.2.2
okhttpVersion=4.12.0
awaitilityVersion=4.2.2
logstashLogbackEncoderVersion=8.0
nimbusJoseJwtVersion=9.48
resilience4jVersion=2.2.0
springdocVersion=2.7.0
lombokVersion=1.18.36
wiremockVersion=3.10.0
shedlockVersion=6.2.0
jjwtVersion=0.12.6
kafkaClientsVersion=3.7.0
